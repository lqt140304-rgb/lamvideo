<!doctype html><html lang="vi"><meta charset="utf-8"><title>Phòng Nam — bản đại tu</title><style>body{margin:0;background:#243730;color:#ede4d0;font:16px Arial}header{padding:20px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}button,select{padding:10px;font:inherit}main{overflow:auto;height:85vh}img{display:block;width:100%;height:auto;margin:auto}small{color:#b9c9b9}</style><header><b>PHÒNG NAM / STYLE B</b><select id="view"><option value="boi-canh">Bảng tổng hợp</option><option value="phong-tro-sang-som">01 / PHÒNG NAM — SÁNG SỚM</option><option value="goc-bep-bon-rua">02 / GÓC BẾP — CHỖ NGƯỜI KIA ĐỨNG</option><option value="goc-ban-hoc-sang">03 / GÓC HỌC — BAN NGÀY</option><option value="ban-hoc-laptop-dem">04 / CÙNG GÓC HỌC — BAN ĐÊM</option></select><button id="minus">−</button><button id="plus">+</button><button id="reset">Vừa khung</button><small>Bản đề xuất · chưa duyệt chuyển động</small></header><main><img id="art" src="boi-canh.svg" alt="Bản vẽ phòng Nam"></main><script>let z=100;const a=document.getElementById('art');document.getElementById('view').onchange=e=>{a.src=e.target.value+'.svg';z=100;a.style.width=z+'%'};function zoom(d){z=Math.min(300,Math.max(60,z+d));a.style.width=z+'%'}document.getElementById('plus').onclick=()=>zoom(25);document.getElementById('minus').onclick=()=>zoom(-25);document.getElementById('reset').onclick=()=>{z=100;a.style.width='100%'};</script></html>
