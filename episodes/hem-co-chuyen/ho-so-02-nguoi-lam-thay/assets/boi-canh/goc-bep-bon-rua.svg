<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Gạch men ốp tường có bóng đổ -->
    <linearGradient id="tile-wall-back" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbf8f2"/>
      <stop offset="100%" stop-color="#ebe3d3"/>
    </linearGradient>
    <linearGradient id="tile-wall-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ded4c1"/>
      <stop offset="100%" stop-color="#ede4d5"/>
    </linearGradient>
    <!-- Mặt inox bồn rửa 3D -->
    <linearGradient id="inox-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="inox-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="sink-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- ======================================================================== -->
  <!-- LAYER 1: GÓC TƯỜNG 3D (TƯỜNG SAU + TƯỜNG BÊN TRÁI + SÀN NHÀ) -->
  <!-- ======================================================================== -->
  <!-- Tường sau (Back Wall) -->
  <polygon points="450,0 1920,0 1920,680 450,680" fill="url(#tile-wall-back)"/>
  <!-- Tường trái (Left Wall) có góc 3D -->
  <polygon points="0,0 450,0 450,680 0,820" fill="url(#tile-wall-left)"/>
  <line x1="450" y1="0" x2="450" y2="680" stroke="#8f826e" stroke-width="4"/>

  <!-- Lưới gạch men tường sau -->
  <g stroke="#dcd4c3" stroke-width="2" opacity="0.8">
    <path d="M450 110 H1920 M450 220 H1920 M450 330 H1920 M450 440 H1920 M450 550 H1920 M450 660 H1920"/>
    <path d="M600 0 V680 M750 0 V680 M900 0 V680 M1050 0 V680 M1200 0 V680 M1350 0 V680 M1500 0 V680 M1650 0 V680 M1800 0 V680"/>
  </g>
  <!-- Lưới gạch men tường trái có phối cảnh xiên -->
  <g stroke="#cfc4af" stroke-width="2" opacity="0.8">
    <line x1="0" y1="130" x2="450" y2="110"/>
    <line x1="0" y1="260" x2="450" y2="220"/>
    <line x1="0" y1="390" x2="450" y2="330"/>
    <line x1="0" y1="530" x2="450" y2="440"/>
    <line x1="0" y1="670" x2="450" y2="550"/>
    <line x1="150" y1="0" x2="150" y2="775"/>
    <line x1="300" y1="0" x2="300" y2="725"/>
  </g>

  <!-- Sàn bếp gạch 3D -->
  <polygon points="0,820 450,680 1920,680 1920,1080 0,1080" fill="#b8a892"/>
  <!-- Nẹp chân tường gạch 3D -->
  <polygon points="0,820 450,680 450,660 0,800" fill="#61523e"/>
  <polygon points="450,680 1920,680 1920,660 450,660" fill="#7a6850"/>
  <line x1="0" y1="820" x2="450" y2="680" stroke="#282b2b" stroke-width="4"/>
  <line x1="450" y1="680" x2="1920" y2="680" stroke="#282b2b" stroke-width="4"/>

  <!-- Đường ron gạch sàn 3D -->
  <g stroke="#786955" stroke-width="2.5" opacity="0.55" stroke-dasharray="12 12">
    <line x1="450" y1="680" x2="-120" y2="1080"/>
    <line x1="750" y1="680" x2="280" y2="1080"/>
    <line x1="1050" y1="680" x2="700" y2="1080"/>
    <line x1="1350" y1="680" x2="1150" y2="1080"/>
    <line x1="1650" y1="680" x2="1600" y2="1080"/>
    <line x1="300" y1="727" x2="1920" y2="727"/>
    <line x1="190" y1="785" x2="1920" y2="785"/>
    <line x1="90" y1="865" x2="1920" y2="865"/>
  </g>

  <!-- ======================================================================== -->
  <!-- LAYER 2: KỆ GIA VỊ 3D TRÊN TƯỜNG (CÓ MẶT TRÊN, MẶT TRƯỚC, BÓNG ĐỔ) -->
  <!-- ======================================================================== -->
  <g transform="translate(620 180)" stroke="#282b2b" stroke-width="4" stroke-linejoin="round">
    <!-- Bóng đổ kệ gỗ lên tường gạch -->
    <polygon points="0,45 520,45 500,85 -20,85" fill="#000" opacity="0.15" filter="url(#sink-shadow)"/>

    <!-- Tấm gỗ kệ gia vị 3D -->
    <!-- Mặt dưới/mặt trước -->
    <rect x="0" y="20" width="500" height="20" fill="#673917" stroke="#282b2b" stroke-width="3.5"/>
    <!-- Mặt trên phẳng 3D -->
    <polygon points="0,20 500,20 530,0 30,0" fill="#9c5c2d" stroke="#282b2b" stroke-width="3.5"/>
    <!-- Ke đỡ sắt chữ L -->
    <polygon points="60,40 60,85 75,40" fill="#282b2b" stroke="none"/>
    <polygon points="440,40 440,85 455,40" fill="#282b2b" stroke="none"/>

    <!-- Các chai lọ gia vị có bóng đổ tròn và nhãn mác 3D -->
    <!-- Chai dầu ăn Simply vàng óng -->
    <g transform="translate(70 -110)">
      <ellipse cx="25" cy="125" rx="22" ry="8" fill="#000" opacity="0.2" filter="url(#sink-shadow)"/>
      <rect x="0" y="15" width="50" height="110" rx="10" fill="#f59e0b" stroke="#282b2b" stroke-width="3.5"/>
      <rect x="15" y="-10" width="20" height="25" rx="4" fill="#dc2626" stroke="#282b2b" stroke-width="2.5"/>
      <text x="25" y="75" font-family="Arial" font-size="10" font-weight="bold" fill="#78350f" text-anchor="middle">DẦU ĂN</text>
    </g>
    <!-- Chai nước mắm Chin-su đỏ sẫm -->
    <g transform="translate(150 -95)">
      <ellipse cx="22" cy="110" rx="20" ry="7" fill="#000" opacity="0.2" filter="url(#sink-shadow)"/>
      <rect x="0" y="15" width="44" height="95" rx="8" fill="#991b1b" stroke="#282b2b" stroke-width="3.5"/>
      <rect x="13" y="-5" width="18" height="20" rx="3" fill="#f59e0b" stroke="#282b2b" stroke-width="2"/>
      <text x="22" y="65" font-family="Arial" font-size="9" font-weight="bold" fill="#fef08a" text-anchor="middle">NƯỚC MẮM</text>
    </g>
    <!-- Hũ muối & hạt nêm Knorr xanh -->
    <g transform="translate(230 -70)">
      <rect x="0" y="0" width="48" height="70" rx="8" fill="#f8fafc" stroke="#282b2b" stroke-width="3"/>
      <text x="24" y="42" font-family="Arial" font-size="10" font-weight="bold" fill="#334155" text-anchor="middle">MUỐI</text>
    </g>
    <g transform="translate(300 -80)">
      <rect x="0" y="0" width="55" height="80" rx="8" fill="#16a34a" stroke="#282b2b" stroke-width="3"/>
      <text x="27" y="45" font-family="Arial" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">KNORR</text>
    </g>
    <!-- Cuộn khăn giấy bếp tròn 3D -->
    <g transform="translate(390 -75)">
      <ellipse cx="30" cy="0" rx="28" ry="12" fill="#f1f5f9" stroke="#282b2b" stroke-width="3"/>
      <rect x="2" y="0" width="56" height="75" fill="#e2e8f0" stroke="#282b2b" stroke-width="3"/>
      <ellipse cx="30" cy="75" rx="28" ry="12" fill="#f1f5f9" stroke="#282b2b" stroke-width="3"/>
    </g>
  </g>

  <!-- ======================================================================== -->
  <!-- LAYER 3: KHỐI BỒN RỬA CHÉN INOX 3D LỚN (ĐẦY ĐỦ MẶT TRÊN, TRƯỚC, HÔNG) -->
  <!-- ======================================================================== -->
  <g id="sink-main-3d" transform="translate(540 460)">
    <!-- Bóng đổ toàn bộ bệ bồn rửa lên sàn gạch -->
    <polygon points="-40,460 1140,460 1080,560 -120,560" fill="#000" opacity="0.28" filter="url(#sink-shadow)"/>

    <!-- MẶT HÔNG BÊN TRÁI 3D (Left Side Face) -->
    <polygon points="-60,110 0,160 0,460 -60,400" fill="#3f4a4e" stroke="#282b2b" stroke-width="4.5"/>

    <!-- THÂN TỦ TRƯỚC (Front Face) -->
    <polygon points="0,160 1100,160 1100,460 0,460" fill="#546369" stroke="#282b2b" stroke-width="5" stroke-linejoin="round"/>
    <!-- Gờ chân thụt lùi (Toe Kick) -->
    <polygon points="30,460 1070,460 1060,485 40,485" fill="#2a3236" stroke="#282b2b" stroke-width="3"/>
    <!-- 2 cánh cửa tủ lớn có tay nắm tròn -->
    <rect x="30" y="190" width="490" height="245" fill="#435056" stroke="#282b2b" stroke-width="3.5"/>
    <rect x="580" y="190" width="490" height="245" fill="#435056" stroke="#282b2b" stroke-width="3.5"/>
    <circle cx="480" cy="310" r="8" fill="#cbd5e1" stroke="#282b2b" stroke-width="2.5"/>
    <circle cx="620" cy="310" r="8" fill="#cbd5e1" stroke="#282b2b" stroke-width="2.5"/>

    <!-- MẶT BÀN ĐÁ GRANIT TRÊN CÙNG (3D Top Counter Surface) -->
    <polygon points="-90,95 1050,95 1120,160 -40,160" fill="#7a8d94" stroke="#282b2b" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="-40,160 1120,160 1120,175 -40,175" fill="#414d52" stroke="#282b2b" stroke-width="3"/>

    <!-- LÒNG CHẬU RỬA ĐÔI INOX CHÌM SÂU 3D -->
    <polygon points="0,105 680,105 700,150 20,150" fill="#2d3538" stroke="#282b2b" stroke-width="4.5"/>
    <!-- 2 hộc chậu rửa inox sáng -->
    <polygon points="15,110 320,110 330,145 25,145" fill="url(#inox-top)" stroke="#282b2b" stroke-width="3"/>
    <polygon points="360,110 665,110 685,145 380,145" fill="url(#inox-top)" stroke="#282b2b" stroke-width="3"/>
    <!-- Lỗ thoát nước kim loại & nắp lọc -->
    <ellipse cx="180" cy="128" rx="24" ry="9" fill="#1e2426" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="530" cy="128" rx="24" ry="9" fill="#1e2426" stroke="#64748b" stroke-width="2"/>

    <!-- VÒI NƯỚC INOX CỔ NGỖNG 3D VỚI CẦN GẠT -->
    <g transform="translate(350 100)">
      <ellipse cx="0" cy="0" rx="20" ry="8" fill="#64748b" stroke="#282b2b" stroke-width="3"/>
      <!-- Thân vòi cổ cong vươn cao -->
      <path d="M0 0 V-160 Q0 -220 -55 -220 Q-110 -220 -110 -155 V-135" fill="none" stroke="#cbd5e1" stroke-width="14" stroke-linecap="round"/>
      <path d="M0 0 V-160 Q0 -220 -55 -220 Q-110 -220 -110 -155 V-135" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
      <!-- Đầu vòi nước & giọt nước trong vắt -->
      <rect x="-120" y="-135" width="20" height="14" rx="3" fill="#475569" stroke="#282b2b" stroke-width="2.5"/>
      <ellipse cx="-110" cy="-100" rx="5" ry="8" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
      <!-- Cần gạt nước ngang -->
      <line x1="10" y1="-8" x2="45" y2="-30" stroke="#64748b" stroke-width="7" stroke-linecap="round"/>
      <circle cx="45" cy="-30" r="7" fill="#e2e8f0" stroke="#282b2b" stroke-width="2"/>
    </g>

    <!-- KHAY ÚP CHÉN BẰNG NHỰA 3D BÊN PHẢI (CHỨA ĐĨA BÁT ĐÃ RỬA SẠCH SẼ) -->
    <g transform="translate(740 30)">
      <!-- Khay nhựa xanh bạc hà 3D có thành khay -->
      <polygon points="0,65 320,65 350,115 30,115" fill="#a7f3d0" stroke="#282b2b" stroke-width="4" opacity="0.9"/>
      <polygon points="30,115 350,115 350,135 30,135" fill="#34d399" stroke="#282b2b" stroke-width="3.5"/>

      <!-- Hàng đĩa sứ trắng úp đứng song song có chiều sâu 3D -->
      <ellipse cx="60" cy="80" rx="16" ry="50" fill="#f8fafc" stroke="#282b2b" stroke-width="3"/>
      <ellipse cx="95" cy="80" rx="16" ry="50" fill="#f8fafc" stroke="#282b2b" stroke-width="3"/>
      <ellipse cx="130" cy="80" rx="16" ry="50" fill="#f8fafc" stroke="#282b2b" stroke-width="3"/>
      <ellipse cx="165" cy="80" rx="16" ry="50" fill="#f8fafc" stroke="#282b2b" stroke-width="3"/>

      <!-- Bát ăn cơm úp chồng lên nhau 3D -->
      <path d="M210 100 Q250 55 290 100 Z" fill="#f1f5f9" stroke="#282b2b" stroke-width="3.5"/>
      <path d="M225 70 Q265 25 305 70 Z" fill="#f1f5f9" stroke="#282b2b" stroke-width="3.5"/>

      <!-- Ống đũa gỗ cắm nghiêng tự nhiên -->
      <rect x="295" y="60" width="35" height="60" rx="6" fill="#38bdf8" stroke="#282b2b" stroke-width="3"/>
      <line x1="305" y1="60" x2="290" y2="-30" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
      <line x1="315" y1="60" x2="310" y2="-35" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
      <line x1="325" y1="60" x2="330" y2="-28" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- CHAI RỬA CHÉN SUNLIGHT & MIẾNG MÚT 3D -->
    <g transform="translate(50 90)">
      <rect x="0" y="-65" width="38" height="75" rx="10" fill="#facc15" stroke="#282b2b" stroke-width="3.5"/>
      <rect x="11" y="-80" width="16" height="16" rx="4" fill="#dc2626" stroke="#282b2b" stroke-width="2.5"/>
      <!-- Miếng mút xơ mướp 3D 2 lớp vàng-xanh -->
      <polygon points="55,-15 105,-15 115,10 65,10" fill="#eab308" stroke="#282b2b" stroke-width="2.5"/>
      <polygon points="55,-25 105,-25 105,-15 55,-15" fill="#15803d" stroke="#282b2b" stroke-width="2.5"/>
        <!-- BÌNH NƯỚC LỌC 20L MÀU XANH DƯƠNG CÓ VÒI RÓT TRÊN KỆ BẾP -->
    <g transform="translate(980 -50)" stroke="#282b2b" stroke-width="3.5">
      <rect x="0" y="0" width="85" height="110" rx="18" fill="#0284c7" opacity="0.88"/>
      <line x1="6" y1="30" x2="79" y2="30" stroke="#38bdf8" stroke-width="3"/>
      <line x1="6" y1="65" x2="79" y2="65" stroke="#38bdf8" stroke-width="3"/>
      <line x1="6" y1="90" x2="79" y2="90" stroke="#38bdf8" stroke-width="3"/>
      <rect x="-14" y="75" width="16" height="14" rx="3" fill="#ffffff" stroke="#282b2b" stroke-width="2.5"/>
      <rect x="-18" y="82" width="9" height="7" fill="#ef4444" stroke="none"/>
    </g>

    <!-- THÙNG MÌ TÔM HẢO HẢO CHUA CAY ĐẶT GẦM TỦ BẾP -->
    <g transform="translate(50 470)" stroke="#282b2b" stroke-width="3">
      <polygon points="0,0 130,0 145,45 15,45" fill="#ea580c" stroke="#282b2b" stroke-width="3"/>
      <polygon points="15,45 145,45 145,75 15,75" fill="#c2410c" stroke="#282b2b" stroke-width="3"/>
      <text x="72" y="28" font-family="Arial" font-size="12" font-weight="900" fill="#fef08a" text-anchor="middle">HẢO HẢO</text>
      <text x="80" y="62" font-family="Arial" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">MÌ TÔM CHUA CAY</text>
    </g>
    </g>
  </g>

  <!-- ======================================================================== -->
  <!-- LAYER 4: CÂY CHỔI RƠM 3D DỰNG GÓC TƯỜNG (CÓ ĐỔ BÓNG LÊN TƯỜNG & SÀN) -->
  <!-- ======================================================================== -->
  <g transform="translate(380 540)" stroke="#282b2b" stroke-width="4" stroke-linejoin="round">
    <!-- Bóng đổ cây chổi lên tường và sàn gạch -->
    <line x1="-30" y1="440" x2="-140" y2="-40" stroke="#000" stroke-width="16" opacity="0.2" stroke-linecap="round" filter="url(#sink-shadow)"/>
    <!-- Cán chổi bằng tre bóng uốn tự nhiên -->
    <line x1="-15" y1="430" x2="-110" y2="-30" stroke="#a16207" stroke-width="10" stroke-linecap="round"/>
    <!-- Bông đót / chổi rơm quét nhà xòe hình quạt 3D -->
    <polygon points="-45,410 35,475 -20,510 -85,450" fill="#d97706" stroke="#282b2b" stroke-width="4"/>
    <line x1="-55" y1="425" x2="5" y2="465" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
    <!-- Đồ hót rác nhựa xanh tiếp đất -->
    <path d="M50 470 L140 470 L160 505 L30 505 Z" fill="#0284c7" stroke="#282b2b" stroke-width="3.5"/>
    <line x1="95" y1="470" x2="95" y2="380" stroke="#0284c7" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- TIÊU ĐỀ BỐI CẢNH 2 -->
  <rect x="30" y="30" width="550" height="55" rx="12" fill="#181a1d" opacity="0.9" stroke="#334155" stroke-width="2"/>
  <text x="50" y="66" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#f8f3e7">BỐI CẢNH 2: GÓC BẾP &amp; BỒN RỬA CHÉN (3D VIEW · 50MM)</text>
</svg>