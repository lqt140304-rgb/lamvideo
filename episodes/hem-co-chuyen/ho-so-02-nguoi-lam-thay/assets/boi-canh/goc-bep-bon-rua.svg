<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Gạch men tường ố vàng nhẹ chân thực phòng trọ -->
    <linearGradient id="kitchen-tiles-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f2e4"/>
      <stop offset="50%" stop-color="#ede4ce"/>
      <stop offset="100%" stop-color="#e4d6bc"/>
    </linearGradient>

    <!-- Ánh sáng hành lang bên ngoài cửa -->
    <linearGradient id="corridor-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92aba0"/>
      <stop offset="100%" stop-color="#cbe0d6"/>
    </linearGradient>

    <!-- Đổ bóng tự nhiên tiếp đất -->
    <filter id="sink-ao" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
    </filter>
  </defs>

  <!-- ======================================================================== -->
  <!-- 1. PHÔNG NỀN: TƯỜNG TRÁI CÓ CỬA CHÍNH, TƯỜNG SAU GẠCH MEN, SÀN GẠCH BÔNG -->
  <!-- ======================================================================== -->
  <!-- Trần & Tường sau gạch men -->
  <rect width="1920" height="1080" fill="#ebe4d5"/>

  <!-- Sàn gạch bông phòng trọ -->
  <polygon points="0,680 1920,680 1920,1080 0,1080" fill="#c8ccbe" stroke="#282b2b" stroke-width="4"/>
  <!-- Ron gạch sàn nhà chạy phối cảnh nhẹ -->
  <g stroke="#b0b5a3" stroke-width="2" opacity="0.75">
    <line x1="0" y1="750" x2="1920" y2="750"/>
    <line x1="0" y1="840" x2="1920" y2="840"/>
    <line x1="0" y1="950" x2="1920" y2="950"/>
    <line x1="180" y1="680" x2="60" y2="1080"/>
    <line x1="560" y1="680" x2="480" y2="1080"/>
    <line x1="960" y1="680" x2="920" y2="1080"/>
    <line x1="1360" y1="680" x2="1360" y2="1080"/>
    <line x1="1760" y1="680" x2="1800" y2="1080"/>
  </g>

  <!-- Mảng tường ốp gạch men khu bếp (Gạch 20x20 màu ngà ố vàng) -->
  <rect x="260" y="0" width="1660" height="680" fill="url(#kitchen-tiles-grad)" stroke="#282b2b" stroke-width="3"/>
  <!-- Lưới ron gạch men ốp tường -->
  <g stroke="#d3c8b2" stroke-width="1.8" opacity="0.8">
    <line x1="260" y1="80" x2="1920" y2="80"/>
    <line x1="260" y1="180" x2="1920" y2="180"/>
    <line x1="260" y1="280" x2="1920" y2="280"/>
    <line x1="260" y1="380" x2="1920" y2="380"/>
    <line x1="260" y1="480" x2="1920" y2="480"/>
    <line x1="260" y1="580" x2="1920" y2="580"/>

    <line x1="380" y1="0" x2="380" y2="680"/>
    <line x1="500" y1="0" x2="500" y2="680"/>
    <line x1="620" y1="0" x2="620" y2="680"/>
    <line x1="740" y1="0" x2="740" y2="680"/>
    <line x1="860" y1="0" x2="860" y2="680"/>
    <line x1="980" y1="0" x2="980" y2="680"/>
    <line x1="1100" y1="0" x2="1100" y2="680"/>
    <line x1="1220" y1="0" x2="1220" y2="680"/>
    <line x1="1340" y1="0" x2="1340" y2="680"/>
    <line x1="1460" y1="0" x2="1460" y2="680"/>
    <line x1="1580" y1="0" x2="1580" y2="680"/>
    <line x1="1700" y1="0" x2="1700" y2="680"/>
    <line x1="1820" y1="0" x2="1820" y2="680"/>
  </g>

  <!-- ======================================================================== -->
  <!-- 2. BÊN TRÁI: CỬA CHÍNH MỞ RA HÀNH LANG (ĂN KHỚP 100% VỚI IMAGE.PNG) -->
  <!-- ======================================================================== -->
  <g id="left-door-area">
    <!-- Khuôn cửa chính mép trái -->
    <rect x="0" y="0" width="260" height="750" fill="#6f8c81" stroke="#282b2b" stroke-width="4"/>
    <!-- Khe mở ra hành lang dài bên ngoài có ánh sáng ban ngày -->
    <rect x="0" y="0" width="210" height="720" fill="url(#corridor-light)"/>
    <!-- Lan can sắt hành lang bên ngoài -->
    <g stroke="#4e6b5f" stroke-width="4" stroke-linecap="round">
      <line x1="10" y1="520" x2="190" y2="460"/>
      <line x1="10" y1="470" x2="190" y2="410"/>
      <line x1="40" y1="510" x2="40" y2="440" stroke-width="3"/>
      <line x1="90" y1="490" x2="90" y2="425" stroke-width="3"/>
      <line x1="140" y1="475" x2="140" y2="410" stroke-width="3"/>
    </g>

    <!-- Cánh cửa mở hé góc trái màu xanh xám (sage green #769384) -->
    <polygon points="120,0 250,50 250,750 120,700" fill="#769384" stroke="#282b2b" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Nẹp pano cửa -->
    <polygon points="135,30 235,70 235,720 135,680" fill="#85a192" stroke="#282b2b" stroke-width="2.5"/>
    <!-- Tay nắm cửa inox -->
    <circle cx="220" cy="420" r="8" fill="#e2e8f0" stroke="#282b2b" stroke-width="2.5"/>

    <!-- CÂY CHỔI RƠM QUÉT NHÀ DỰNG GÓC TƯỜNG (Y HỆT IMAGE.PNG) -->
    <g id="straw-broom" stroke="#282b2b" stroke-width="3.5" stroke-linejoin="round">
      <!-- Cán tre -->
      <line x1="290" y1="760" x2="245" y2="400" stroke="#854d0e" stroke-width="7" stroke-linecap="round"/>
      <!-- Bó rơm vàng xòe góc dưới -->
      <polygon points="270,720 315,760 280,785 240,745" fill="#eab308" stroke-width="3.5"/>
      <line x1="260" y1="730" x2="295" y2="770" stroke="#ca8a04" stroke-width="2.5"/>
    </g>
  </g>

  <!-- ======================================================================== -->
  <!-- 3. KỆ GỖ TREO TƯỜNG ĐỰNG GIA VỊ (THEO ĐÚNG IMAGE.PNG) -->
  <!-- ======================================================================== -->
  <g id="spice-shelf" transform="translate(560 120)" stroke="#282b2b" stroke-width="3.5" stroke-linejoin="round">
    <!-- Vết ố dầu mỡ sau kệ gia vị -->
    <ellipse cx="320" cy="40" rx="140" ry="30" fill="#d4a373" opacity="0.2" stroke="none" filter="url(#sink-ao)"/>

    <!-- Tấm gỗ kệ gia vị dày dặn -->
    <polygon points="0,65 650,65 670,85 20,85" fill="#8a6d55" stroke-width="4"/>
    <polygon points="20,85 670,85 670,105 20,105" fill="#6c523e" stroke-width="3"/>
    <!-- Ke đỡ kệ sắt chữ L -->
    <polygon points="100,105 100,165 115,165 115,105" fill="#1e293b" stroke-width="2.5"/>
    <polygon points="540,105 540,165 555,165 555,105" fill="#1e293b" stroke-width="2.5"/>

    <!-- Các chai lọ gia vị trên kệ -->
    <!-- Chai dầu ăn Meizan vàng trong -->
    <rect x="50" y="-35" width="40" height="95" rx="6" fill="#eab308" opacity="0.9" stroke-width="3"/>
    <rect x="60" y="-50" width="20" height="15" rx="2" fill="#dc2626" stroke-width="2"/>
    <rect x="55" y="5" width="30" height="35" fill="#fef08a" stroke="none"/>
    <!-- Chai nước mắm Nam Ngư đỏ đậm -->
    <rect x="115" y="-25" width="36" height="85" rx="5" fill="#7f1d1d" stroke-width="3"/>
    <rect x="125" y="-42" width="16" height="17" rx="2" fill="#ea580c" stroke-width="2"/>
    <!-- Hũ muối trắng sứ -->
    <rect x="180" y="0" width="44" height="60" rx="6" fill="#ffffff" stroke-width="3"/>
    <rect x="184" y="-8" width="36" height="8" rx="2" fill="#334155" stroke-width="2"/>
    <!-- Hũ hạt nêm Knorr xanh lá -->
    <rect x="250" y="0" width="46" height="60" rx="6" fill="#15803d" stroke-width="3"/>
    <rect x="254" y="-8" width="38" height="8" rx="2" fill="#fef08a" stroke-width="2"/>
    <!-- Hũ tiêu đen thủy tinh trong suốt -->
    <rect x="325" y="-15" width="38" height="75" rx="6" fill="#e2e8f0" opacity="0.75" stroke-width="3"/>
    <ellipse cx="344" cy="35" rx="14" ry="16" fill="#1e293b" stroke="none"/>
  </g>

  <!-- ======================================================================== -->
  <!-- 4. KHỐI BÀN BẾP & BỒN RỬA CHÉN INOX (SÁT TƯỜNG, ĐÚNG THEO IMAGE.PNG) -->
  <!-- ======================================================================== -->
  <g id="kitchen-sink-counter" transform="translate(350 430)" stroke="#282b2b" stroke-width="4" stroke-linejoin="round">
    <!-- Bóng đổ khối bếp xuống sàn gạch -->
    <polygon points="-30,410 1350,410 1310,470 -70,470" fill="#000" opacity="0.25" filter="url(#sink-ao)"/>

    <!-- Nẹp viền chân tường đá hoa cương và silicon chống thấm -->
    <polygon points="-15,5 1320,5 1320,25 -15,25" fill="#334155" stroke-width="2"/>
    <line x1="-15" y1="25" x2="1320" y2="25" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

    <!-- Mặt bàn bếp đá sáng màu (Đồng bộ với image.png) -->
    <polygon points="-20,25 1320,25 1340,95 -20,95" fill="#f1f5f9" stroke-width="4.5"/>
    <polygon points="-20,95 1340,95 1340,120 -20,120" fill="#cbd5e1" stroke-width="3"/>

    <!-- Mặt hông bên trái bàn bếp (kê giáp hướng cửa) -->
    <polygon points="-20,25 -20,95 -20,400 -40,360 -40,15" fill="#7a8f85" stroke-width="3.5"/>

    <!-- BỒN RỬA CHÉN INOX 2 NGĂN CHÌM TRÊN MẶT ĐÁ -->
    <g transform="translate(80 35)" stroke="#282b2b" stroke-width="3.5">
      <!-- Ngăn rửa chén bên trái -->
      <polygon points="0,5 340,5 330,55 10,55" fill="#64748b" stroke-width="3"/>
      <ellipse cx="170" cy="35" rx="140" ry="14" fill="#475569"/>
      <!-- Lỗ thoát nước inox ngăn trái -->
      <circle cx="170" cy="35" r="14" fill="#1e293b" stroke-width="2"/>
      <circle cx="170" cy="35" r="5" fill="#64748b" stroke="none"/>

      <!-- Ngăn rửa chén bên phải -->
      <polygon points="370,5 710,5 700,55 380,55" fill="#64748b" stroke-width="3"/>
      <ellipse cx="540" cy="35" rx="140" ry="14" fill="#475569"/>
      <!-- Lỗ thoát nước inox ngăn phải -->
      <circle cx="540" cy="35" r="14" fill="#1e293b" stroke-width="2"/>
      <circle cx="540" cy="35" r="5" fill="#64748b" stroke="none"/>
    </g>

    <!-- VÒI NƯỚC INOX CỔ NGỖNG CHÍNH GIỮA BỒN RỬA -->
    <g transform="translate(435 30)">
      <!-- Chân đế vòi tròn -->
      <ellipse cx="0" cy="5" rx="18" ry="7" fill="#94a3b8" stroke="#282b2b" stroke-width="3"/>
      <!-- Thân vòi cổ ngỗng uốn cao -->
      <path d="M0 5 L0 -170 Q0 -240 -80 -240 Q-140 -240 -140 -170 L-140 -140" fill="none" stroke="#475569" stroke-width="18" stroke-linecap="round"/>
      <path d="M0 5 L0 -170 Q0 -240 -80 -240 Q-140 -240 -140 -170 L-140 -140" fill="none" stroke="#e2e8f0" stroke-width="10" stroke-linecap="round"/>
      <!-- Đầu lọc vòi nước -->
      <rect x="-150" y="-140" width="20" height="16" rx="3" fill="#334155" stroke="#282b2b" stroke-width="2.5"/>
      <!-- Giọt nước nhỏ tong tong xuống đáy bồn -->
      <path d="M-140 -115 Q-135 -100 -140 -85 Q-145 -100 -140 -115" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>

      <!-- Tay gạt nước inox gạt chéo -->
      <line x1="0" y1="-15" x2="45" y2="-35" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
      <circle cx="45" cy="-35" r="7" fill="#cbd5e1" stroke="#282b2b" stroke-width="2.5"/>
    </g>

    <!-- ĐỒ ĐẠC TRÊN BÀN BẾP: BÁT ĐŨA, ĐĨA XẾP CHỒNG, NƯỚC RỬA CHÉN -->
    <g transform="translate(850 40)" stroke="#282b2b" stroke-width="3" stroke-linejoin="round">
      <!-- Khay úp chén xanh ngọc -->
      <rect x="0" y="-10" width="280" height="55" rx="6" fill="#a7f3d0" stroke-width="3"/>
      <!-- 4 Đĩa sứ tròn xếp dựng đứng cạnh nhau -->
      <ellipse cx="40" cy="10" rx="16" ry="36" fill="#ffffff"/>
      <ellipse cx="80" cy="10" rx="16" ry="36" fill="#ffffff"/>
      <ellipse cx="120" cy="10" rx="16" ry="36" fill="#ffffff"/>
      <ellipse cx="160" cy="10" rx="16" ry="36" fill="#ffffff"/>
      <!-- Bát to có 2 chiếc đũa gác chéo (Y hệt image.png) -->
      <path d="M190 5 Q230 45 270 5 Z" fill="#fef08a" stroke-width="3"/>
      <line x1="180" y1="10" x2="285" y2="-30" stroke="#854d0e" stroke-width="4" stroke-linecap="round"/>
      <line x1="185" y1="16" x2="292" y2="-26" stroke="#854d0e" stroke-width="4" stroke-linecap="round"/>
      <!-- Cốc nước thủy tinh -->
      <rect x="-40" y="-5" width="24" height="35" rx="3" fill="#bae6fd" opacity="0.8"/>
    </g>

    <!-- Chai rửa chén Sunlight vàng chanh & miếng cọ xơ mướp -->
    <g transform="translate(25 40)" stroke="#282b2b" stroke-width="2.5" stroke-linejoin="round">
      <rect x="0" y="-20" width="28" height="65" rx="8" fill="#facc15"/>
      <rect x="6" y="-32" width="16" height="12" rx="2" fill="#dc2626" stroke-width="2"/>
      <!-- Miếng cọ rửa chén xanh lá -->
      <rect x="40" y="5" width="42" height="24" rx="4" fill="#15803d"/>
      <rect x="40" y="29" width="42" height="10" rx="2" fill="#fef08a" stroke-none=""/>
    </g>

    <!-- BÌNH NƯỚC LỌC 20L XANH KÊ GÓC PHẢI BỒN RỬA -->
    <g transform="translate(1160 5)" stroke="#282b2b" stroke-width="3.5">
      <rect x="0" y="-75" width="80" height="110" rx="16" fill="#0284c7" opacity="0.9"/>
      <line x1="6" y1="-45" x2="74" y2="-45" stroke="#38bdf8" stroke-width="3.5"/>
      <line x1="6" y1="-15" x2="74" y2="-15" stroke="#38bdf8" stroke-width="3.5"/>
      <line x1="6" y1="15" x2="74" y2="15" stroke="#38bdf8" stroke-width="3.5"/>
      <!-- Vòi rót nước đỏ trắng -->
      <rect x="-14" y="0" width="16" height="14" rx="3" fill="#ffffff" stroke-width="2.5"/>
      <rect x="-18" y="8" width="8" height="7" fill="#ef4444" stroke="none"/>
    </g>

    <!-- KHỐI TỦ BẾP DƯỚI MÀU XANH XÁM NHẠT (SAGE GREEN #9cae9b, ĐỒNG BỘ 100% IMAGE.PNG) -->
    <polygon points="-20,120 1340,120 1340,410 -20,410" fill="#9cae9b" stroke-width="4.5"/>

    <!-- 3 Cánh tủ bếp phẳng có pano chìm và núm kéo inox tròn -->
    <g stroke="#282b2b" stroke-width="3.5">
      <!-- Cánh 1 -->
      <rect x="0" y="135" width="420" height="250" rx="4" fill="#8fa38e"/>
      <circle cx="390" cy="260" r="7" fill="#e2e8f0" stroke-width="2"/>
      <!-- Cánh 2 -->
      <rect x="440" y="135" width="440" height="250" rx="4" fill="#8fa38e"/>
      <circle cx="470" cy="260" r="7" fill="#e2e8f0" stroke-width="2"/>
      <!-- Cánh 3 -->
      <rect x="900" y="135" width="420" height="250" rx="4" fill="#8fa38e"/>
      <circle cx="930" cy="260" r="7" fill="#e2e8f0" stroke-width="2"/>
    </g>

    <!-- THÙNG MÌ TÔM HẢO HẢO CHUA CAY ĐẶT GẦM TỦ BẾP -->
    <g transform="translate(160 415)" stroke="#282b2b" stroke-width="3.5">
      <polygon points="0,0 160,0 180,45 20,45" fill="#ea580c" stroke-width="3.5"/>
      <polygon points="20,45 180,45 180,75 20,75" fill="#c2410c" stroke-width="3.5"/>
      <text x="90" y="30" font-family="Arial" font-size="14" font-weight="900" fill="#fef08a" text-anchor="middle">HẢO HẢO</text>
      <text x="100" y="64" font-family="Arial" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">MÌ TÔM CHUA CAY</text>
    </g>
  </g>

  <!-- ======================================================================== -->
  <!-- 5. PHÍA TRƯỚC BÊN TRÁI: CHIẾC QUẠT ĐỨNG SINH VIÊN (Y HỆT IMAGE.PNG) -->
  <!-- ======================================================================== -->
  <g id="standing-fan-closeup" transform="translate(480 680)" stroke="#282b2b" stroke-width="4" stroke-linejoin="round">
    <!-- Bóng quạt đổ xuống sàn gạch -->
    <ellipse cx="0" cy="280" rx="110" ry="35" fill="#000" opacity="0.22" filter="url(#sink-ao)"/>

    <!-- Chân đế quạt tròn mâm đúc to vững chãi trên sàn -->
    <ellipse cx="0" cy="280" rx="95" ry="28" fill="#5f7e75"/>
    <ellipse cx="0" cy="274" rx="80" ry="22" fill="#75988e" stroke="none"/>

    <!-- Trục ống đứng quạt điều chỉnh độ cao -->
    <line x1="0" y1="270" x2="0" y2="70" stroke="#384c47" stroke-width="16" stroke-linecap="round"/>
    <line x1="0" y1="270" x2="0" y2="70" stroke="#75988e" stroke-width="7" stroke-linecap="round"/>
    <!-- Khớp siết cổ quạt -->
    <rect x="-12" y="120" width="24" height="20" rx="3" fill="#1e293b"/>

    <!-- Lồng quạt tròn màu xanh bạc hà (đường kính lớn 210px) -->
    <circle cx="0" cy="0" r="105" fill="#d1fae5" fill-opacity="0.35" stroke="#282b2b" stroke-width="5"/>
    <circle cx="0" cy="0" r="96" fill="none" stroke="#75988e" stroke-width="3" stroke-dasharray="10 6"/>
    <!-- Trục quạt trung tâm -->
    <circle cx="0" cy="0" r="22" fill="#334155" stroke="#282b2b" stroke-width="3.5"/>

    <!-- 3 cánh quạt xoay màu xanh dương đậm sinh viên -->
    <g stroke="#282b2b" stroke-width="3">
      <path d="M0 0 Q-35 -65 10 -85 Q40 -60 0 0" fill="#3b82f6" opacity="0.85"/>
      <path d="M0 0 Q75 -10 85 40 Q50 65 0 0" fill="#3b82f6" opacity="0.85"/>
      <path d="M0 0 Q-45 65 -75 25 Q-60 -20 0 0" fill="#3b82f6" opacity="0.85"/>
    </g>
    <!-- Nan bảo vệ lồng quạt -->
    <line x1="-105" y1="0" x2="105" y2="0" stroke="#64748b" stroke-width="3"/>
    <line x1="0" y1="-105" x2="0" y2="105" stroke="#64748b" stroke-width="3"/>
  </g>

  <!-- TIÊU ĐỀ BỐI CẢNH 2 -->
  <rect x="30" y="30" width="570" height="55" rx="12" fill="#181a1d" opacity="0.9" stroke="#334155" stroke-width="2"/>
  <text x="50" y="66" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#f8f3e7">BỐI CẢNH 2: GÓC BẾP &amp; BỒN RỬA CHÉN (3D VIEW · 50MM)</text>
</svg>