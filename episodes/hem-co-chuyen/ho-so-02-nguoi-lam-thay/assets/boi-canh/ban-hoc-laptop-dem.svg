<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Quầng sáng ấm áp từ bóng đèn bàn học -->
    <radialGradient id="lamp-glow" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fffde7" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#fde047" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#ca8a04" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.0"/>
    </radialGradient>
    <!-- Quầng sáng màn hình laptop -->
    <linearGradient id="laptop-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="screen-bloom">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- TOÀN BỘ PHÒNG TRỌ CHÌM TRONG BÓNG ĐÊM HUYỀN BÍ -->
  <rect width="1920" height="1080" fill="#12161f"/>
  <!-- Tường đêm & nẹp sàn mờ -->
  <rect width="1920" height="700" fill="#18202c"/>
  <rect y="700" width="1920" height="380" fill="#0f141c"/>
  <line x1="0" y1="700" x2="1920" y2="700" stroke="#243042" stroke-width="6" stroke-linecap="round"/>

  <!-- HẬU CẢNH MỜ ẢO: GIƯỜNG NỆM NƠI NAM VỪA BẬT DẬY -->
  <g transform="translate(120 480)" opacity="0.45" stroke="#282b2b" stroke-width="3.5" stroke-linejoin="round">
    <path d="M0 40 L340 0 L580 80 L240 180 Z" fill="#1e293b"/>
    <path d="M120 50 Q240 25 360 60 Q480 90 500 150 Q360 190 180 170 Z" fill="#1e3a34"/> <!-- Chăn xô lệch -->
    <path d="M80 40 Q150 20 200 45 Z" fill="#475569"/>
  </g>

  <!-- VÙNG QUẦNG SÁNG VÀNG ẤM TỪ ĐÈN BÀN RỌI KHẮP BÀN HỌC -->
  <ellipse cx="1160" cy="520" rx="680" ry="440" fill="url(#lamp-glow)" stroke="none"/>

  <!-- BÀN HỌC SINH VIÊN BẰNG GỖ CÔNG NGHIỆP TRUNG TÂM -->
  <g id="study-desk" transform="translate(740 480)" stroke="#282b2b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- Thân bàn & hộc tủ ngăn kéo bên phải -->
    <rect x="0" y="60" width="920" height="380" fill="#382b21" stroke="#282b2b" stroke-width="5"/>
    <!-- Hộc ngăn kéo đựng tài liệu & căn cước -->
    <rect x="620" y="80" width="260" height="100" fill="#4a392b" stroke="#282b2b" stroke-width="3.5"/>
    <rect x="620" y="200" width="260" height="100" fill="#4a392b" stroke="#282b2b" stroke-width="3.5"/>
    <circle cx="750" cy="130" r="6" fill="#d4af37" stroke="#282b2b" stroke-width="2"/>
    <circle cx="750" cy="250" r="6" fill="#d4af37" stroke="#282b2b" stroke-width="2"/>
    <!-- Khoảng trống để chân sinh viên ngồi -->
    <rect x="80" y="100" width="480" height="340" fill="#1c1712" stroke="#282b2b" stroke-width="4"/>

    <!-- Mặt bàn gỗ phẳng màu nâu mật ong ấm -->
    <rect x="-40" y="20" width="1000" height="55" rx="8" fill="#8a5833" stroke="#282b2b" stroke-width="5"/>

    <!-- ĐÈN BÀN HỌC CỔ NGỖNG PHÁT SÁNG (BÊN PHẢI BÀN) -->
    <g transform="translate(820 20)">
      <!-- Đế đèn kim loại tròn -->
      <ellipse cx="0" cy="0" rx="35" ry="12" fill="#dc2626" stroke="#282b2b" stroke-width="3"/>
      <!-- Cần đèn lò xo uốn cong về phía laptop -->
      <path d="M0 0 Q40 -120 -50 -180 Q-140 -230 -160 -190" fill="none" stroke="#475569" stroke-width="9" stroke-linecap="round"/>
      <!-- Chụp đèn nhôm màu đỏ hướng xuống mặt bàn -->
      <path d="M-180 -195 L-125 -165 L-150 -115 L-225 -135 Z" fill="#ef4444" stroke="#282b2b" stroke-width="4"/>
      <!-- Bóng đèn LED sáng rực bên trong chụp đèn -->
      <ellipse cx="-185" cy="-125" rx="22" ry="10" fill="#fffde7" stroke="none" transform="rotate(20 -185 -125)"/>
    </g>

    <!-- LAPTOP CŨ ĐANG CẮM SẠC & MỞ BÀI TẬP NHÓM (TRUNG TÂM BÀN) -->
    <g transform="translate(260 20)">
      <!-- Thân máy laptop đặt trên bàn -->
      <path d="M-120 0 L160 0 L195 65 L-155 65 Z" fill="#334155" stroke="#282b2b" stroke-width="4"/>
      <!-- Bàn phím & Touchpad -->
      <path d="M-105 10 L145 10 L165 42 L-125 42 Z" fill="#1e293b" stroke="none"/>
      <rect x="0" y="46" width="50" height="14" rx="2" fill="#475569" stroke="#282b2b" stroke-width="1.5"/>
      <!-- Dây sạc laptop cắm vào cạnh máy bò ra sau bàn -->
      <path d="M-125 15 Q-160 15 -190 35 Q-230 65 -280 85" fill="none" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round"/>

      <!-- MÀN HÌNH LAPTOP MỞ GÓC NGHIÊNG 100 ĐỘ SÁNG RỰC -->
      <g filter="url(#screen-bloom)">
        <polygon points="-120,0 160,0 150,-190 -130,-190" fill="#0f172a" stroke="#282b2b" stroke-width="4"/>
        <!-- Màn hình hiển thị Google Docs màu xanh lơ trắng -->
        <polygon points="-110,-10 150,-10 142,-180 -122,-180" fill="url(#laptop-screen)" stroke="none"/>
        <!-- Thanh công cụ Google Docs màu xanh dương phía trên -->
        <polygon points="-110,-165 140,-165 142,-180 -122,-180" fill="#2563eb" stroke="none"/>
        <text x="-100" y="-169" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" fill="#ffffff">BÀI TẬP NHÓM — HOÀN THIỆN</text>
        <!-- Các dòng văn bản đã được Người Kia gõ hoàn chỉnh ngay ngắn -->
        <g stroke="#334155" stroke-width="2.5" stroke-linecap="round" opacity="0.75">
          <line x1="-100" y1="-145" x2="20" y2="-145"/>
          <line x1="-100" y1="-130" x2="120" y2="-130"/>
          <line x1="-100" y1="-115" x2="130" y2="-115"/>
          <line x1="-100" y1="-100" x2="110" y2="-100"/>
          <line x1="-100" y1="-85" x2="125" y2="-85"/>
          <line x1="-100" y1="-70" x2="90" y2="-70"/>
          <line x1="-100" y1="-55" x2="130" y2="-55"/>
          <line x1="-100" y1="-40" x2="60" y2="-40"/>
          <!-- Dấu trỏ nhấp nháy màu xanh -->
          <line x1="65" y1="-44" x2="65" y2="-36" stroke="#2563eb" stroke-width="3"/>
        </g>
      </g>
    </g>

    <!-- ĐIỆN THOẠI CẠNH LAPTOP (BẬT KHÔNG LÀM PHIỀN & CUỘC GỌI NHỠ) -->
    <g transform="translate(540 30)">
      <!-- Thân máy điện thoại smartphone -->
      <rect x="0" y="0" width="62" height="115" rx="10" fill="#090d16" stroke="#282b2b" stroke-width="3"/>
      <!-- Màn hình sáng nhẹ -->
      <rect x="5" y="8" width="52" height="99" rx="6" fill="#1e293b" stroke="none"/>
      <!-- Biểu tượng mặt trăng 'Không làm phiền' -->
      <path d="M22 22 A 6 6 0 1 1 14 14 A 4.5 4.5 0 0 0 22 22 Z" fill="#a855f7" stroke="none"/>
      <!-- Icon thông báo cuộc gọi nhỡ màu đỏ của trưởng nhóm -->
      <circle cx="42" cy="18" r="6" fill="#ef4444" stroke="none"/>
      <text x="42" y="21" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
      <!-- Tin nhắn Zalo của Tùng hiện popup -->
      <rect x="8" y="32" width="46" height="32" rx="4" fill="#0284c7" stroke="none"/>
      <text x="12" y="42" font-family="Arial, sans-serif" font-size="5.5" font-weight="bold" fill="#ffffff">TÙNG: Đi đánh</text>
      <text x="12" y="50" font-family="Arial, sans-serif" font-size="5.5" font-weight="bold" fill="#ffffff">cầu về trễ...</text>
      <!-- Vạch thông báo giục bài -->
      <rect x="8" y="70" width="46" height="12" rx="3" fill="#334155" stroke="none"/>
      <text x="12" y="78" font-family="Arial, sans-serif" font-size="5" fill="#94a3b8">Trưởng nhóm: Bài đâu?</text>
    </g>

    <!-- LY NƯỚC LỌC & ỐNG CẮM BÚT SINH VIÊN -->
    <g transform="translate(50 15)">
      <!-- Ống cắm bút -->
      <rect x="0" y="-45" width="42" height="55" rx="6" fill="#0284c7" stroke="#282b2b" stroke-width="3"/>
      <line x1="10" y1="-45" x2="5" y2="-75" stroke="#dc2626" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="22" y1="-45" x2="24" y2="-80" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="32" y1="-45" x2="38" y2="-70" stroke="#eab308" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Ly thủy tinh có nước -->
      <path d="M65 -40 L70 10 L100 10 L105 -40 Z" fill="#bae6fd" stroke="#282b2b" stroke-width="2.8" opacity="0.8"/>
    </g>
  </g>

  <!-- CHIẾC GHẾ TỰA XOAY NHẸ NƠI NGƯỜI KIA ĐANG NGỒI GÕ BÀI -->
  <g transform="translate(960 620)" stroke="#282b2b" stroke-width="4" stroke-linejoin="round">
    <path d="M-10 0 L120 0 L105 70 L5 70 Z" fill="#453225" stroke="#282b2b" stroke-width="4.5"/>
    <!-- Lưng ghế gỗ cao có ánh sáng màn hình laptop hắt nhẹ -->
    <path d="M0 0 L15 -180 L95 -180 L110 0" fill="none" stroke="#5c4033" stroke-width="8" stroke-linecap="round"/>
    <line x1="0" y1="70" x2="-15" y2="220" stroke="#382417" stroke-width="7" stroke-linecap="round"/>
    <line x1="105" y1="70" x2="120" y2="220" stroke="#382417" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- TIÊU ĐỀ BỐI CẢNH -->
  <rect x="30" y="30" width="500" height="52" rx="10" fill="#282b2b" opacity="0.88" stroke="none"/>
  <text x="50" y="65" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#f8f3e7">BỐI CẢNH 4: BÀN HỌC BAN ĐÊM (50MM)</text>
</svg>