<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Quầng sáng ấm áp tỏa từ chóa đèn bàn -->
    <radialGradient id="lamp-volumetric" cx="45%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#fffde7" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#fde047" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.0"/>
    </radialGradient>
    <!-- Màn hình laptop phát sáng xanh lơ -->
    <linearGradient id="screen-grad-3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="night-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="glow-screen">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ======================================================================== -->
  <!-- LAYER 1: KHÔNG GIAN PHÒNG TRỌ BAN ĐÊM (DARK NIGHT MOOD) -->
  <!-- ======================================================================== -->
  <rect width="1920" height="1080" fill="#0d1117"/>
  <!-- Tường đêm & nẹp sàn mờ trong bóng tối -->
  <rect width="1920" height="690" fill="#161b22"/>
  <rect y="690" width="1920" height="390" fill="#0c1015"/>
  <line x1="0" y1="690" x2="1920" y2="690" stroke="#21262d" stroke-width="6" stroke-linecap="round"/>

  <!-- HẬU CẢNH MỜ ẢO: NỆM NGỦ NAM VỪA BẬT DẬY TRONG BÓNG TỐI -->
  <g transform="translate(100 480)" opacity="0.4" stroke="#282b2b" stroke-width="3.5" stroke-linejoin="round">
    <polygon points="0,40 360,-10 600,70 240,170" fill="#1e293b"/>
    <path d="M120 40 Q260 15 380 50 Q500 80 520 150 Q380 190 180 160 Z" fill="#1e3a34"/> <!-- Chăn rêu xô lệch -->
    <ellipse cx="150" cy="45" rx="65" ry="28" fill="#334155"/>
  </g>

  <!-- ======================================================================== -->
  <!-- LAYER 2: QUẦNG SÁNG VOLUMETRIC CỦA ĐÈN BÀN RỌI SÁNG MẶT BÀN GỖ -->
  <!-- ======================================================================== -->
  <ellipse cx="1200" cy="530" rx="700" ry="460" fill="url(#lamp-volumetric)" stroke="none"/>

  <!-- ======================================================================== -->
  <!-- LAYER 3: BÀN HỌC SINH VIÊN 3D BẰNG GỖ CÔNG NGHIỆP TRUNG TÂM -->
  <!-- ======================================================================== -->
  <g id="desk-3d-unit" transform="translate(720 470)">
    <!-- GIÁ SÁCH GỖ 2 TẦNG LIỀN BÀN HỌC SINH VIÊN (Kinh điển bàn sinh viên) -->
    <g transform="translate(0 -160)" stroke="#282b2b" stroke-width="4" stroke-linejoin="round">
      <!-- Khung tủ giá sách trên mặt bàn -->
      <polygon points="-70,0 920,0 930,170 -60,170" fill="#3a281c" stroke="#282b2b" stroke-width="4.5"/>
      <line x1="-65" y1="85" x2="925" y2="85" stroke="#282b2b" stroke-width="4"/> <!-- Ngăn giữa -->
      <line x1="430" y1="0" x2="430" y2="170" stroke="#282b2b" stroke-width="4"/> <!-- Vách ngăn dọc -->

      <!-- CÁC CUỐN SÁCH GIÁO TRÌNH ĐẠI HỌC XẾP TRÊN GIÁ SÁCH -->
      <!-- Tầng 1: Sách dựng đứng (Toán cao cấp, Triết học Mác-Lênin, Kinh tế vi mô) -->
      <g stroke="#282b2b" stroke-width="2.5">
        <rect x="-50" y="15" width="22" height="65" fill="#dc2626"/>
        <text x="-40" y="50" font-family="Arial" font-size="6" font-weight="bold" fill="#fff" transform="rotate(-90 -40 50)">TRIẾT HỌC</text>
        <rect x="-25" y="10" width="25" height="70" fill="#2563eb"/>
        <text x="-15" y="50" font-family="Arial" font-size="6" font-weight="bold" fill="#fff" transform="rotate(-90 -15 50)">TOÁN C.CẤP</text>
        <rect x="3" y="18" width="20" height="62" fill="#16a34a"/>
        <text x="13" y="50" font-family="Arial" font-size="6" font-weight="bold" fill="#fff" transform="rotate(-90 13 50)">KINH TẾ</text>
        <!-- Chồng vở ghi A4 xếp nằm ngang -->
        <polygon points="30,60 120,60 125,78 35,78" fill="#f8fafc"/>
        <polygon points="28,45 118,45 120,60 30,60" fill="#fef08a"/>
      </g>

      <!-- Tờ giấy note dán trên vách giá sách: Lịch thi & Đề tài nhóm -->
      <rect x="160" y="20" width="45" height="45" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" transform="rotate(-8 160 20)"/>
      <text x="165" y="38" font-family="Arial" font-size="6.5" font-weight="bold" fill="#854d0e" transform="rotate(-8 160 20)">NỘP BÀI!</text>
      <text x="165" y="48" font-family="Arial" font-size="5" fill="#b91c1c" transform="rotate(-8 160 20)">Hôm nay 23h59</text>
    </g>
    <!-- Bóng đổ toàn bộ bàn học lên sàn đêm -->
    <polygon points="-50,460 1050,460 980,570 -130,570" fill="#000" opacity="0.5" filter="url(#night-shadow)"/>

    <!-- MẶT HÔNG BÊN TRÁI 3D (Left Side Face) -->
    <polygon points="-50,20 0,65 0,440 -50,390" fill="#2b1f17" stroke="#282b2b" stroke-width="4.5"/>

    <!-- THÂN BÀN TRƯỚC (Front Face) & KHOANG CHÂN SINH VIÊN -->
    <polygon points="0,65 960,65 960,440 0,440" fill="#3f2d21" stroke="#282b2b" stroke-width="5" stroke-linejoin="round"/>
    <!-- Khoang trống để chân ngồi học -->
    <rect x="60" y="95" width="520" height="345" fill="#17110c" stroke="#282b2b" stroke-width="4"/>

    <!-- KHỐI 2 HỘC NGĂN KÉO BÊN PHẢI (Có mặt nổi 3D & núm kéo) -->
    <g stroke="#282b2b" stroke-width="3.5">
      <!-- Ngăn kéo trên (chứa giấy tờ, căn cước) -->
      <rect x="630" y="90" width="290" height="125" rx="4" fill="#4a3527"/>
      <circle cx="775" cy="152" r="7" fill="#d4af37" stroke-width="2"/>
      <!-- Ngăn kéo dưới -->
      <rect x="630" y="240" width="290" height="155" rx="4" fill="#4a3527"/>
      <circle cx="775" cy="317" r="7" fill="#d4af37" stroke-width="2"/>
    </g>

    <!-- MẶT BÀN GỖ NẰM NGANG 3D MÀU NÂU MẬT ONG (Desktop 3D Surface) -->
    <polygon points="-80,10 930,10 1010,65 0,65" fill="#8a5833" stroke="#282b2b" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="0,65 1010,65 1010,80 0,80" fill="#54361e" stroke="#282b2b" stroke-width="3"/>

    <!-- ====================================================================== -->
    <!-- ĐÈN BÀN HỌC CỔ NGỖNG 3D PHÁT SÁNG (BÊN PHẢI MẶT BÀN) -->
    <!-- ====================================================================== -->
    <g transform="translate(840 25)">
      <!-- Đế đèn kim loại tròn dày -->
      <ellipse cx="0" cy="0" rx="40" ry="14" fill="#b91c1c" stroke="#282b2b" stroke-width="3.5"/>
      <ellipse cx="0" cy="-4" rx="38" ry="12" fill="#ef4444" stroke="#282b2b" stroke-width="2"/>
      <!-- Cần đèn lò xo uốn cong 3D vươn về phía laptop -->
      <path d="M0 -4 Q50 -130 -40 -190 Q-130 -240 -150 -200" fill="none" stroke="#334155" stroke-width="10" stroke-linecap="round"/>
      <!-- Chụp đèn nhôm đỏ hướng chéo xuống mặt bàn -->
      <path d="M-175 -205 L-120 -170 L-145 -120 L-220 -140 Z" fill="#dc2626" stroke="#282b2b" stroke-width="4"/>
      <!-- Bóng đèn LED sáng rực bên trong chóa đèn -->
      <ellipse cx="-180" cy="-130" rx="25" ry="12" fill="#fffde7" stroke="none" transform="rotate(20 -180 -130)"/>
    </g>

    <!-- ====================================================================== -->
    <!-- LAPTOP 3D CẮM SẠC & MÀN HÌNH GOOGLE DOCS SÁNG RỰC (TRUNG TÂM BÀN) -->
    <!-- ====================================================================== -->
    <g transform="translate(280 20)">
      <!-- Đế máy laptop nằm nghiêng 3D trên bàn -->
      <polygon points="-140,0 160,0 200,65 -180,65" fill="#1e293b" stroke="#282b2b" stroke-width="4.5"/>
      <!-- Bàn phím gõ có ánh sáng xanh hắt nhẹ -->
      <polygon points="-120,8 140,8 165,45 -145,45" fill="#0f172a" stroke="none"/>
      <!-- Touchpad chuột cảm ứng -->
      <rect x="-10" y="48" width="55" height="14" rx="2" fill="#334155" stroke="#282b2b" stroke-width="1.5"/>

      <!-- Dây sạc laptop cắm vào cạnh máy bò ra sau bàn -->
      <path d="M-145 15 Q-190 20 -230 45 Q-280 80 -330 110" fill="none" stroke="#020617" stroke-width="5" stroke-linecap="round"/>

      <!-- MÀN HÌNH LAPTOP MỞ GÓC NGHIÊNG 105 ĐỘ SÁNG RỰC TRONG ĐÊM -->
      <g filter="url(#glow-screen)">
        <polygon points="-140,0 160,0 150,-205 -150,-205" fill="#020617" stroke="#282b2b" stroke-width="4.5"/>
        <!-- Màn hình hiển thị Google Docs sáng rực -->
        <polygon points="-130,-10 150,-10 142,-195 -142,-195" fill="url(#screen-grad-3d)" stroke="none"/>
        <!-- Thanh menu Google Docs màu xanh dương -->
        <polygon points="-130,-178 140,-178 142,-195 -142,-195" fill="#2563eb" stroke="none"/>
        <text x="-120" y="-183" font-family="Arial" font-size="8.5" font-weight="bold" fill="#ffffff">BÀI TẬP NHÓM — HOÀN THIỆN (NGƯỜI LÀM THAY)</text>
        <!-- Các đoạn văn bản đã được gõ hoàn chỉnh, chia đề mục rõ ràng -->
        <g stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
          <line x1="-120" y1="-155" x2="20" y2="-155" stroke-width="3.5" stroke="#1d4ed8"/> <!-- Tiêu đề phần 1 -->
          <line x1="-120" y1="-140" x2="120" y2="-140"/>
          <line x1="-120" y1="-125" x2="130" y2="-125"/>
          <line x1="-120" y1="-110" x2="110" y2="-110"/>
          <line x1="-120" y1="-95" x2="125" y2="-95"/>
          <line x1="-120" y1="-80" x2="40" y2="-80" stroke-width="3.5" stroke="#1d4ed8"/> <!-- Tiêu đề phần 2 -->
          <line x1="-120" y1="-65" x2="130" y2="-65"/>
          <line x1="-120" y1="-50" x2="120" y2="-50"/>
          <line x1="-120" y1="-35" x2="70" y2="-35"/>
          <!-- Dấu trỏ soạn thảo nhấp nháy -->
          <line x1="75" y1="-40" x2="75" y2="-30" stroke="#2563eb" stroke-width="3"/>
        </g>
      </g>
    </g>

    <!-- ====================================================================== -->
    <!-- ĐIỆN THOẠI 3D SÁNG MÀN HÌNH CẠNH LAPTOP (KHÔNG LÀM PHIỀN & CUỘC GỌI NHỠ) -->
    <!-- ====================================================================== -->
    <g transform="translate(570 30)">
      <!-- Thân máy smartphone viền cong nằm nghiêng 3D -->
      <rect x="0" y="0" width="68" height="125" rx="12" fill="#020617" stroke="#282b2b" stroke-width="3.5"/>
      <!-- Màn hình sáng dịu trong đêm -->
      <rect x="5" y="8" width="58" height="109" rx="8" fill="#0f172a" stroke="none"/>

      <!-- Icon mặt trăng tím 'Không làm phiền' (Do Not Disturb) -->
      <path d="M24 24 A 7 7 0 1 1 15 15 A 5 5 0 0 0 24 24 Z" fill="#c084fc" stroke="none"/>
      <!-- Badge thông báo cuộc gọi nhỡ màu đỏ của nhóm -->
      <circle cx="48" cy="20" r="7" fill="#ef4444" stroke="none"/>
      <text x="48" y="24" font-family="Arial" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>

      <!-- Tin nhắn Zalo của Tùng hiện popup nổi bật -->
      <rect x="8" y="36" width="52" height="35" rx="5" fill="#0284c7" stroke="none"/>
      <text x="12" y="47" font-family="Arial" font-size="6" font-weight="bold" fill="#ffffff">TÙNG: Đi đánh</text>
      <text x="12" y="56" font-family="Arial" font-size="6" font-weight="bold" fill="#ffffff">cầu về trễ...</text>
      <text x="12" y="65" font-family="Arial" font-size="5" fill="#e0f2fe">Mày ăn trước đi</text>

      <!-- Vạch thông báo cuộc gọi nhỡ -->
      <rect x="8" y="78" width="52" height="15" rx="3" fill="#1e293b" stroke="none"/>
      <text x="12" y="88" font-family="Arial" font-size="5.5" fill="#f87171">Trưởng nhóm: Bài đâu?</text>
    </g>

    <!-- LY NƯỚC LỌC THỦY TINH & ỐNG CẮM BÚT 3D -->
    <g transform="translate(50 15)">
      <rect x="0" y="-50" width="45" height="60" rx="8" fill="#0284c7" stroke="#282b2b" stroke-width="3.5"/>
      <line x1="10" y1="-50" x2="5" y2="-85" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
      <line x1="22" y1="-50" x2="24" y2="-90" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>
      <line x1="34" y1="-50" x2="40" y2="-80" stroke="#eab308" stroke-width="5" stroke-linecap="round"/>
      <path d="M70 -45 L76 10 L108 10 L114 -45 Z" fill="#bae6fd" stroke="#282b2b" stroke-width="3" opacity="0.85"/>
    </g>
  </g>

  <!-- ======================================================================== -->
  <!-- LAYER 4: CHIẾC GHẾ XOAY HỌC SINH CÔNG THÁI HỌC 3D HOÀN TOÀN MỚI (STUDENT TASK CHAIR) -->
  <!-- ======================================================================== -->
  <g transform="translate(1010 680)" stroke="#282b2b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- Bóng đổ chân sao trên sàn đêm -->
    <ellipse cx="0" cy="150" rx="115" ry="35" fill="#000" opacity="0.55" filter="url(#night-shadow)"/>

    <!-- CHÂN SAO 5 CÁNH BÁNH XE (5-STAR BASE WITH CASTERS) -->
    <g transform="translate(0 135)">
      <line x1="0" y1="0" x2="0" y2="22" stroke="#475569" stroke-width="12"/>
      <!-- Chân trước trái -->
      <line x1="0" y1="10" x2="-75" y2="16" stroke="#1e293b" stroke-width="8"/>
      <!-- Chân trước phải -->
      <line x1="0" y1="10" x2="75" y2="16" stroke="#1e293b" stroke-width="8"/>
      <!-- Chân giữa trước -->
      <line x1="0" y1="10" x2="-15" y2="28" stroke="#334155" stroke-width="9"/>
      <!-- Chân sau trái -->
      <line x1="0" y1="10" x2="-65" y2="-5" stroke="#0f172a" stroke-width="7"/>
      <!-- Chân sau phải -->
      <line x1="0" y1="10" x2="65" y2="-5" stroke="#0f172a" stroke-width="7"/>

      <!-- 5 Bánh xe con lăn kép tiếp đất -->
      <circle cx="-75" cy="18" r="6.5" fill="#0f172a"/>
      <circle cx="75" cy="18" r="6.5" fill="#0f172a"/>
      <circle cx="-15" cy="30" r="7" fill="#0f172a"/>
      <circle cx="-65" cy="-3" r="5.5" fill="#0f172a"/>
      <circle cx="65" cy="-3" r="5.5" fill="#0f172a"/>
    </g>

    <!-- TRỤC NÂNG HẠ PÍT-TÔNG KIM LOẠI & CẦN GẠT -->
    <rect x="-7" y="75" width="14" height="62" rx="3" fill="#94a3b8" stroke="#282b2b" stroke-width="3"/>
    <rect x="-12" y="95" width="24" height="12" rx="2" fill="#334155" stroke="#282b2b" stroke-width="2.5"/>
    <line x1="10" y1="70" x2="45" y2="80" stroke="#1e293b" stroke-width="5"/>
    <circle cx="45" cy="80" r="5" fill="#020617" stroke="none"/>

    <!-- ĐỆM NGỒI BỌC NỈ ÊM ÁI (SEAT CUSHION WITH 3D BEVEL) -->
    <path d="M-75 55 Q0 70 75 55 L65 75 Q0 88 -65 75 Z" fill="#0f172a" stroke="#282b2b" stroke-width="4"/>
    <path d="M-80 40 Q0 20 80 40 Q75 65 65 75 Q0 88 -65 75 Q-75 65 -80 40 Z" fill="#1e293b" stroke="#282b2b" stroke-width="4.5"/>
    <path d="M-70 45 Q0 30 70 45" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>

    <!-- TAY VỊN 2 BÊN (ARMRESTS) -->
    <path d="M-75 40 L-85 -5 Q-85 -20 -70 -20 L-50 -20" fill="none" stroke="#334155" stroke-width="6"/>
    <path d="M75 40 L85 -5 Q85 -20 70 -20 L50 -20" fill="none" stroke="#334155" stroke-width="6"/>

    <!-- LƯNG GHẾ LƯỚI CÔNG THÁI HỌC UỐN CONG CÓ ÁNH SÁNG MÀN HÌNH HẮT VÀO -->
    <path d="M-55 30 Q-70 -50 -60 -120 Q-55 -160 0 -165 Q55 -160 60 -120 Q70 -50 55 30 Z" fill="#090d14" stroke="#282b2b" stroke-width="5"/>
    <path d="M-45 20 Q-58 -50 -50 -110 Q-45 -145 0 -150 Q45 -145 50 -110 Q58 -50 45 20 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2" opacity="0.85"/>
    <path d="M-48 -60 Q0 -75 48 -60" fill="none" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
    <!-- Tựa đầu bọc da đen -->
    <ellipse cx="0" cy="-175" rx="35" ry="16" fill="#1e293b" stroke="#282b2b" stroke-width="3.5"/>
  </g>

  <!-- TIÊU ĐỀ BỐI CẢNH 4 -->
  <rect x="30" y="30" width="550" height="55" rx="12" fill="#181a1d" opacity="0.9" stroke="#334155" stroke-width="2"/>
  <text x="50" y="66" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#f8f3e7">BỐI CẢNH 4: BÀN HỌC BAN ĐÊM (3D VIEW · 50MM)</text>
</svg>