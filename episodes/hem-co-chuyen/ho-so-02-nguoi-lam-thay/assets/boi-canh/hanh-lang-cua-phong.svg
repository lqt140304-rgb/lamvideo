<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="hallway-recede" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8c7c67"/>
      <stop offset="100%" stop-color="#baa991"/>
    </linearGradient>
    <linearGradient id="door-3d-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f5157"/>
      <stop offset="50%" stop-color="#546c73"/>
      <stop offset="100%" stop-color="#344348"/>
    </linearGradient>
    <filter id="door-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- ======================================================================== -->
  <!-- LAYER 1: BÊN TRONG PHÒNG TRỌ (TƯỜNG VÀ SÀN) -->
  <!-- ======================================================================== -->
  <rect width="1920" height="760" fill="#dfd5c4"/>
  <rect y="760" width="1920" height="320" fill="#b3a288"/>
  <line x1="0" y1="760" x2="1920" y2="760" stroke="#786851" stroke-width="8" stroke-linecap="round"/>

  <!-- Ron gạch sàn phòng trọ -->
  <g stroke="#94846d" stroke-width="2.5" opacity="0.6" stroke-dasharray="14 14">
    <line x1="200" y1="760" x2="-100" y2="1080"/>
    <line x1="600" y1="760" x2="400" y2="1080"/>
    <line x1="1000" y1="760" x2="900" y2="1080"/>
    <line x1="1400" y1="760" x2="1400" y2="1080"/>
    <line x1="1800" y1="760" x2="1900" y2="1080"/>
    <line x1="0" y1="830" x2="1920" y2="830"/>
    <line x1="0" y1="920" x2="1920" y2="920"/>
    <line x1="0" y1="1020" x2="1920" y2="1020"/>
  </g>

  <!-- ======================================================================== -->
  <!-- LAYER 2: Ô THÔNG GIÓ NHÌN RA HÀNH LANG DÀI HUN HÚT BÊN NGOÀI -->
  <!-- ======================================================================== -->
  <g transform="translate(480 60)" stroke="#282b2b" stroke-width="4" stroke-linejoin="round">
    <!-- Khung ô chớp thông gió bê tông dày -->
    <rect x="0" y="0" width="580" height="130" fill="#2b221a" stroke="#282b2b" stroke-width="6"/>
    <!-- Bầu trời & hành lang dài bên ngoài nhìn qua ô chớp -->
    <rect x="12" y="12" width="556" height="106" fill="#e5dfd4" stroke="none"/>

    <!-- DÃY LAN CAN HÀNH LANG DÀI VÀ CỘT NHÀ ĐỐI DIỆN -->
    <line x1="12" y1="75" x2="568" y2="75" stroke="#475569" stroke-width="4"/>
    <line x1="80" y1="12" x2="80" y2="118" stroke="#475569" stroke-width="3"/>
    <line x1="160" y1="12" x2="160" y2="118" stroke="#475569" stroke-width="3"/>
    <line x1="240" y1="12" x2="240" y2="118" stroke="#475569" stroke-width="3"/>
    <line x1="320" y1="12" x2="320" y2="118" stroke="#475569" stroke-width="3"/>
    <line x1="400" y1="12" x2="400" y2="118" stroke="#475569" stroke-width="3"/>
    <line x1="480" y1="12" x2="480" y2="118" stroke="#475569" stroke-width="3"/>

    <!-- Nan chớp gỗ nghiêng góc 3D -->
    <line x1="0" y1="40" x2="580" y2="50" stroke="#282b2b" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="80" x2="580" y2="90" stroke="#282b2b" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- ======================================================================== -->
  <!-- LAYER 3: KHUNG CỬA PHÒNG GỖ 3D DÀY & THEN CÀI CHỐT TRƯỢT KIM LOẠI GÀI CỨNG -->
  <!-- ======================================================================== -->
  <g id="door-and-latch-unit" transform="translate(460 210)">
    <!-- Bóng đổ khung cửa lên tường -->
    <polygon points="-20,0 640,0 650,560 -10,560" fill="#000" opacity="0.2" filter="url(#door-shadow)"/>

    <!-- Khuôn bao cửa gỗ dày dặn (Door Frame / Jamb) -->
    <rect x="0" y="0" width="620" height="560" fill="#271f18" stroke="#282b2b" stroke-width="7" rx="3"/>
    <!-- Độ dày mép tường 3D bên trong khuôn cửa -->
    <polygon points="18,15 602,15 595,25 25,25" fill="#423429"/>

    <!-- Cánh cửa gỗ dày màu xanh xám đóng kín hoàn toàn -->
    <rect x="25" y="20" width="570" height="535" fill="url(#door-3d-grad)" stroke="#282b2b" stroke-width="5"/>

    <!-- Các ô Pano dập chỉ nổi 3D có bóng đổ nội tại -->
    <rect x="55" y="50" width="510" height="200" rx="10" fill="#39494e" stroke="#282b2b" stroke-width="4"/>
    <rect x="55" y="285" width="510" height="240" rx="10" fill="#39494e" stroke="#282b2b" stroke-width="4"/>
    <!-- Chỉ viền nổi trang trí -->
    <rect x="70" y="65" width="480" height="170" rx="6" fill="none" stroke="#52676e" stroke-width="3"/>
    <rect x="70" y="300" width="480" height="210" rx="6" fill="none" stroke="#52676e" stroke-width="3"/>

    <!-- MẮT MÈO DÒ XÉT (Peephole) bằng đồng -->
    <circle cx="310" cy="150" r="12" fill="#d4af37" stroke="#282b2b" stroke-width="3.5"/>
    <circle cx="310" cy="150" r="5" fill="#0f172a" stroke="none"/>

    <!-- BỘ THEN CÀI CHỐT TRƯỢT KIM LOẠI 3D (CƠ CẤU GÀI CHỐT CĂNG THẲNG TRONG TRUYỆN) -->
    <g transform="translate(390 260)">
      <!-- Bóng đổ chốt lên cánh cửa -->
      <rect x="5" y="-20" width="210" height="60" rx="6" fill="#000" opacity="0.35" filter="url(#door-shadow)"/>

      <!-- Tấm đế kim loại bắt vít phía cánh cửa -->
      <rect x="0" y="-25" width="140" height="55" rx="6" fill="#94a3b8" stroke="#282b2b" stroke-width="3.5"/>
      <!-- 4 ốc vít kim loại -->
      <circle cx="15" cy="-12" r="3.5" fill="#334155" stroke="none"/>
      <circle cx="15" cy="15" r="3.5" fill="#334155" stroke="none"/>
      <circle cx="125" cy="-12" r="3.5" fill="#334155" stroke="none"/>
      <circle cx="125" cy="15" r="3.5" fill="#334155" stroke="none"/>

      <!-- Ngàm giữ chốt bắt vào khung bao cửa bên phải -->
      <rect x="155" y="-25" width="50" height="55" rx="5" fill="#94a3b8" stroke="#282b2b" stroke-width="3.5"/>
      <circle cx="175" cy="-12" r="3.5" fill="#334155" stroke="none"/>
      <circle cx="175" cy="15" r="3.5" fill="#334155" stroke="none"/>

      <!-- Ống trượt giữ then cài -->
      <rect x="35" y="-18" width="35" height="40" rx="4" fill="#64748b" stroke="#282b2b" stroke-width="3"/>
      <rect x="85" y="-18" width="35" height="40" rx="4" fill="#64748b" stroke="#282b2b" stroke-width="3"/>

      <!-- THANH CHỐT TRƯỢT INOX SÁNG ĐANG GÀI CHẶT SANG NGÀM KHUNG CỬA (LOCKED DEADBOLT) -->
      <rect x="25" y="-12" width="165" height="28" rx="5" fill="#f1f5f9" stroke="#282b2b" stroke-width="4"/>
      <rect x="25" y="-12" width="165" height="8" fill="#ffffff" opacity="0.7" stroke="none"/>
      <!-- Tay gạt chốt hướng chúc xuống (khóa cứng an toàn) -->
      <circle cx="80" cy="2" r="8" fill="#cbd5e1" stroke="#282b2b" stroke-width="3"/>
      <rect x="75" y="2" width="10" height="30" rx="4" fill="#475569" stroke="#282b2b" stroke-width="3"/>

      <!-- Khóa tay nắm tròn phụ bên dưới -->
      <circle cx="75" cy="120" r="26" fill="#d4af37" stroke="#282b2b" stroke-width="4"/>
      <circle cx="75" cy="120" r="7" fill="#1e293b" stroke="none"/>
    </g>

    <!-- Khe hở chân cửa hắt sáng ban mai từ hành lang -->
    <rect x="25" y="547" width="570" height="8" fill="#fef08a" opacity="0.85" stroke="none"/>
    <!-- Bóng đen 2 bàn chân của Người Kia in qua khe sáng (Đang kiên nhẫn đứng đợi ngoài hành lang) -->
    <ellipse cx="310" cy="551" rx="40" ry="3.5" fill="#181a1d" stroke="none"/>
  </g>

  <!-- ======================================================================== -->
  <!-- LAYER 4: CHIẾC GHẾ GỖ TỰA 3D NAM KÉO RA ĐẶT CHÍNH DIỆN CANH CHỐT CỬA -->
  <!-- ======================================================================== -->
  <g transform="translate(690 640)" stroke="#282b2b" stroke-width="4" stroke-linejoin="round">
    <!-- Bóng đổ ghế lên nền phòng -->
    <polygon points="-25,230 185,230 150,280 -60,280" fill="#000" opacity="0.22" filter="url(#door-shadow)"/>

    <!-- 4 chân ghế chạm sàn ở 4 cao độ phối cảnh 3D -->
    <line x1="0" y1="140" x2="-20" y2="235" stroke="#613717" stroke-width="8" stroke-linecap="round"/>
    <line x1="140" y1="140" x2="160" y2="235" stroke="#613717" stroke-width="8" stroke-linecap="round"/>
    <line x1="25" y1="90" x2="15" y2="195" stroke="#40230c" stroke-width="6" stroke-linecap="round"/>
    <line x1="115" y1="90" x2="125" y2="195" stroke="#40230c" stroke-width="6" stroke-linecap="round"/>

    <!-- Mặt ngồi ghế gỗ 3D -->
    <polygon points="15,70 125,70 145,140 -5,140" fill="#9c5c2d" stroke="#282b2b" stroke-width="4.5"/>
    <polygon points="-5,140 145,140 145,152 -5,152" fill="#613717" stroke="#282b2b" stroke-width="3"/>

    <!-- Lưng ghế gỗ cao quay trực diện chốt cửa -->
    <path d="M15 70 L25 -170 L115 -170 L125 70" fill="none" stroke="#784421" stroke-width="9" stroke-linecap="round"/>
    <line x1="30" y1="-115" x2="110" y2="-115" stroke="#784421" stroke-width="7"/>
    <line x1="26" y1="-45" x2="114" y2="-45" stroke="#784421" stroke-width="7"/>
  </g>

  <!-- ======================================================================== -->
  <!-- LAYER 5: BÀN NHỎ BÊN PHẢI CÓ VÍ TIỀN VÀ THẺ CĂN CƯỚC CÔNG DÂN (NAM KIỂM TRA ĐỒ) -->
  <!-- ======================================================================== -->
  <g transform="translate(1300 620)" stroke="#282b2b" stroke-width="4" stroke-linejoin="round">
    <!-- Bóng đổ bàn lên tường và sàn -->
    <polygon points="0,160 480,160 430,300 -50,300" fill="#000" opacity="0.2" filter="url(#door-shadow)"/>

    <!-- Thân bàn gỗ 3D (Mặt bàn, cạnh dày, 4 chân) -->
    <!-- Mặt bàn gỗ nằm ngang 3D -->
    <polygon points="0,0 450,0 480,45 30,45" fill="#9a5f33" stroke="#282b2b" stroke-width="4.5"/>
    <polygon points="30,45 480,45 480,65 30,65" fill="#6b3e1d" stroke="#282b2b" stroke-width="3.5"/>

    <!-- 4 chân bàn gỗ đứng vững trên sàn -->
    <line x1="45" y1="65" x2="35" y2="290" stroke="#543015" stroke-width="8" stroke-linecap="round"/>
    <line x1="465" y1="65" x2="475" y2="290" stroke="#543015" stroke-width="8" stroke-linecap="round"/>
    <line x1="20" y1="45" x2="15" y2="240" stroke="#381f0d" stroke-width="6" stroke-linecap="round"/>
    <line x1="435" y1="45" x2="445" y2="240" stroke="#381f0d" stroke-width="6" stroke-linecap="round"/>

    <!-- VÍ DA GẬP MÀU NÂU 3D ĐẶT TRÊN MẶT BÀN -->
    <g transform="translate(80 10)">
      <polygon points="0,5 75,-10 90,15 15,30" fill="#713f12" stroke="#282b2b" stroke-width="3"/>
      <polygon points="15,30 90,15 90,22 15,37" fill="#452408" stroke="#282b2b" stroke-width="2.5"/>
    </g>

    <!-- THẺ CĂN CƯỚC CÔNG DÂN GẮN CHIP (NAM CẦM SO VỚI MẶT NGƯỜI KIA) -->
    <g transform="translate(180 15) rotate(12)">
      <polygon points="0,0 80,0 80,50 0,50" fill="#0284c7" stroke="#282b2b" stroke-width="2.8"/>
      <!-- Ảnh chân dung Nam trên căn cước -->
      <rect x="6" y="8" width="24" height="32" fill="#f8fafc" stroke="#282b2b" stroke-width="1.5"/>
      <circle cx="18" cy="18" r="6" fill="#dbad82"/>
      <path d="M10 35 Q18 28 26 35 Z" fill="#5c7a70"/> <!-- Áo xanh rêu Nam -->
      <!-- Con chip điện tử màu vàng kim -->
      <rect x="35" y="15" width="12" height="10" rx="2" fill="#fbbf24" stroke="#b45309" stroke-width="1"/>
      <!-- Dòng chữ CĂN CƯỚC CÔNG DÂN -->
      <text x="34" y="34" font-family="Arial" font-size="5" font-weight="bold" fill="#fff">CĂN CƯỚC</text>
      <text x="34" y="42" font-family="Arial" font-size="4.5" fill="#bae6fd">HỌ TÊN: NAM</text>
    </g>
  </g>

  <!-- TIÊU ĐỀ BỐI CẢNH 3 -->
  <rect x="30" y="30" width="570" height="55" rx="12" fill="#181a1d" opacity="0.9" stroke="#334155" stroke-width="2"/>
  <text x="50" y="66" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#f8f3e7">BỐI CẢNH 3: CỬA GÀI CHỐT &amp; HÀNH LANG DÀI (3D · 35MM)</text>
</svg>