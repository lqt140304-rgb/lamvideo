<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="h-wall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ded5c3"/>
      <stop offset="100%" stop-color="#c9beaa"/>
    </linearGradient>
    <linearGradient id="door-wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#42565c"/>
      <stop offset="40%" stop-color="#556d74"/>
      <stop offset="100%" stop-color="#38484e"/>
    </linearGradient>
    <linearGradient id="hallway-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f0e6"/>
      <stop offset="100%" stop-color="#ded6c8"/>
    </linearGradient>
  </defs>

  <!-- NỀN PHÒNG & TƯỜNG BÊN TRONG -->
  <rect width="1920" height="780" fill="url(#h-wall)"/>
  <rect y="780" width="1920" height="300" fill="#b8aa92"/>
  <line x1="0" y1="780" x2="1920" y2="780" stroke="#786953" stroke-width="8" stroke-linecap="round"/>

  <!-- GÓC NHÌN XUYÊN Ô CHỚP THÔNG GIÓ TRÊN CỬA RA HÀNH LANG DÃY TRỌ -->
  <g transform="translate(540 80)" stroke="#282b2b" stroke-width="4" stroke-linejoin="round">
    <!-- Khung ô chớp thông gió -->
    <rect x="0" y="0" width="520" height="120" fill="#332c25" stroke="#282b2b" stroke-width="5"/>
    <!-- Bầu trời & ánh sáng giếng trời hành lang bên ngoài -->
    <rect x="10" y="10" width="500" height="100" fill="url(#hallway-light)" stroke="none"/>
    <!-- Dãy lan can hành lang bên ngoài nhìn qua ô chớp -->
    <line x1="10" y1="70" x2="510" y2="70" stroke="#526058" stroke-width="4"/>
    <line x1="80" y1="10" x2="80" y2="110" stroke="#526058" stroke-width="3"/>
    <line x1="160" y1="10" x2="160" y2="110" stroke="#526058" stroke-width="3"/>
    <line x1="240" y1="10" x2="240" y2="110" stroke="#526058" stroke-width="3"/>
    <line x1="320" y1="10" x2="320" y2="110" stroke="#526058" stroke-width="3"/>
    <line x1="400" y1="10" x2="400" y2="110" stroke="#526058" stroke-width="3"/>
    <!-- Các lá chớp gỗ chéo nghiêng -->
    <line x1="0" y1="35" x2="520" y2="45" stroke="#282b2b" stroke-width="4"/>
    <line x1="0" y1="75" x2="520" y2="85" stroke="#282b2b" stroke-width="4"/>
  </g>

  <!-- KHUNG CỬA PHÒNG GỖ LỚN (ĐÃ ĐÓNG KÍN VÀ GÀI THEN CHỐT) -->
  <g id="closed-door" transform="translate(520 220)" stroke="#282b2b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- Khung bao cửa dày -->
    <rect x="0" y="0" width="560" height="620" fill="#2b241e" stroke="#282b2b" stroke-width="6"/>
    <!-- Cánh cửa gỗ dày màu xanh xám đóng kín hoàn toàn -->
    <rect x="20" y="15" width="520" height="605" fill="url(#door-wood)" stroke="#282b2b" stroke-width="5"/>
    <!-- Các panel dập chỉ nổi trên cánh cửa -->
    <rect x="50" y="45" width="460" height="240" rx="8" fill="#3c4e54" stroke="#282b2b" stroke-width="3.5"/>
    <rect x="50" y="325" width="460" height="265" rx="8" fill="#3c4e54" stroke="#282b2b" stroke-width="3.5"/>

    <!-- THEN CÀI CHỐT CỬA CƠ HỌC BẰNG KIM LOẠI (CHI TIẾT THEN CHỐT TỪ KỊCH BẢN) -->
    <g transform="translate(380 280)">
      <!-- Tấm đế kim loại bắt vít vào cánh cửa -->
      <rect x="0" y="-25" width="120" height="50" rx="6" fill="#94a3b8" stroke="#282b2b" stroke-width="3"/>
      <circle cx="15" cy="-12" r="3" fill="#334155" stroke="none"/>
      <circle cx="15" cy="12" r="3" fill="#334155" stroke="none"/>
      <!-- Ngàm đỡ chốt bắt vào khung cửa bên phải -->
      <rect x="135" y="-25" width="40" height="50" rx="5" fill="#94a3b8" stroke="#282b2b" stroke-width="3"/>
      <circle cx="155" cy="-12" r="3" fill="#334155" stroke="none"/>
      <circle cx="155" cy="12" r="3" fill="#334155" stroke="none"/>

      <!-- THANH CHỐT TRƯỢT KIM LOẠI ĐANG GÀI CHẶT SANG NGÀM -->
      <rect x="20" y="-12" width="135" height="24" rx="4" fill="#e2e8f0" stroke="#282b2b" stroke-width="3.5"/>
      <!-- Tay nắm gạt chốt hướng xuống (khóa cứng) -->
      <circle cx="75" cy="0" r="7" fill="#cbd5e1" stroke="#282b2b" stroke-width="2.5"/>
      <rect x="71" y="0" width="8" height="26" rx="3" fill="#475569" stroke="#282b2b" stroke-width="2.5"/>

      <!-- Khóa phụ tay nắm tròn bên dưới -->
      <circle cx="70" cy="110" r="24" fill="#d4af37" stroke="#282b2b" stroke-width="3.5"/>
      <circle cx="70" cy="110" r="6" fill="#282b2b" stroke="none"/>
    </g>

    <!-- MẮT MÈO DÒ XÉT (PEEPHOLE) -->
    <circle cx="280" cy="160" r="10" fill="#d4af37" stroke="#282b2b" stroke-width="3"/>
    <circle cx="280" cy="160" r="4" fill="#1e293b" stroke="none"/>

    <!-- Khe sáng mỏng rọi dưới chân cửa (thể hiện Người Kia đang đứng bên ngoài) -->
    <rect x="20" y="612" width="520" height="8" fill="#fef08a" opacity="0.75" stroke="none"/>
    <!-- Bóng chân người đứng cách cửa vài bước in qua khe sáng -->
    <ellipse cx="280" cy="616" rx="35" ry="3" fill="#282b2b" opacity="0.6" stroke="none"/>
  </g>

  <!-- CHIẾC GHẾ GỖ TỰA NAM KÉO RA ĐẶT CHÍNH DIỆN ĐỂ CANH CHỐT CỬA -->
  <g transform="translate(740 680)" stroke="#282b2b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- Lưng ghế gỗ cao tựa về phía người xem -->
    <path d="M0 0 L15 -180 L105 -180 L120 0" fill="none" stroke="#784421" stroke-width="8"/>
    <line x1="25" y1="-130" x2="95" y2="-130" stroke="#784421" stroke-width="6"/>
    <line x1="20" y1="-80" x2="100" y2="-80" stroke="#784421" stroke-width="6"/>
    <!-- Mặt ngồi ghế gỗ -->
    <path d="M-10 0 L130 0 L115 65 L5 65 Z" fill="#a05a2c" stroke="#282b2b" stroke-width="4.5"/>
    <!-- 4 chân ghế chống vững chắc xuống sàn -->
    <line x1="0" y1="65" x2="-15" y2="190" stroke="#784421" stroke-width="7"/>
    <line x1="115" y1="65" x2="130" y2="190" stroke="#784421" stroke-width="7"/>
    <line x1="25" y1="65" x2="20" y2="165" stroke="#522d14" stroke-width="5"/>
    <line x1="95" y1="65" x2="100" y2="165" stroke="#522d14" stroke-width="5"/>
  </g>

  <!-- ĐIỆN THOẠI & VÍ TIỀN TRÊN BÀN BÊN CẠNH (NAM KIỂM TRA ĐỒ) -->
  <g transform="translate(1320 620)" stroke="#282b2b" stroke-width="3.5" stroke-linejoin="round">
    <!-- Mặt bàn gỗ nhỏ -->
    <rect x="0" y="0" width="420" height="40" fill="#855229" stroke="#282b2b" stroke-width="4"/>
    <line x1="20" y1="40" x2="20" y2="280" stroke="#613b1c" stroke-width="7" stroke-linecap="round"/>
    <line x1="400" y1="40" x2="400" y2="280" stroke="#613b1c" stroke-width="7" stroke-linecap="round"/>
    <!-- Ví da gấp màu nâu mở he hé -->
    <rect x="50" y="-18" width="65" height="35" rx="6" fill="#713f12" stroke="#282b2b" stroke-width="3"/>
    <!-- Thẻ căn cước công dân gắn chip để cạnh ví -->
    <rect x="130" y="-15" width="65" height="42" rx="4" fill="#0284c7" stroke="#282b2b" stroke-width="2.5" transform="rotate(8 130 -15)"/>
    <rect x="136" y="-10" width="18" height="24" fill="#f8fafc" stroke="none" transform="rotate(8 130 -15)"/> <!-- Ảnh chân dung -->
    <text x="165" y="2" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#ffffff" transform="rotate(8 130 -15)">CĂN CƯỚC</text>
  </g>

  <!-- TIÊU ĐỀ BỐI CẢNH -->
  <rect x="30" y="30" width="520" height="52" rx="10" fill="#282b2b" opacity="0.88" stroke="none"/>
  <text x="50" y="65" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#f8f3e7">BỐI CẢNH 3: CỬA GÀI CHỐT &amp; HÀNH LANG (35MM)</text>
</svg>