<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Gạch men ốp tường ngà ố vàng (Đồng bộ 100% với Bối cảnh 1) -->
    <linearGradient id="tile-wall-back" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6f0df"/>
      <stop offset="50%" stop-color="#ede2cb"/>
      <stop offset="100%" stop-color="#e2d3b5"/>
    </linearGradient>
    <linearGradient id="tile-wall-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ded2bd"/>
      <stop offset="100%" stop-color="#cbbea8"/>
    </linearGradient>
    <!-- Mặt inox bồn rửa 3D -->
    <linearGradient id="inox-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="sink-ao" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- ======================================================================== -->
  <!-- 1. GÓC PHÒNG BẾP 3D: TƯỜNG SAU + GÓC TƯỜNG PHẢI + KHUÔN CỬA BÊN TRÁI -->
  <!-- ======================================================================== -->
  <!-- Tường sau (Back Wall ốp gạch men) -->
  <polygon points="0,0 1620,0 1620,620 0,620" fill="url(#tile-wall-back)"/>
  <!-- Tường phải (Right Wall ốp gạch men góc phòng trọ) -->
  <polygon points="1620,0 1920,0 1920,720 1620,620" fill="url(#tile-wall-right)"/>
  <line x1="1620" y1="0" x2="1620" y2="620" stroke="#8f826e" stroke-width="4"/>

  <!-- Lưới gạch men tường sau -->
  <g stroke="#dcd4c3" stroke-width="2" opacity="0.75">
    <path d="M0 100 H1620 M0 200 H1620 M0 300 H1620 M0 400 H1620 M0 500 H1620 M0 600 H1620"/>
    <path d="M150 0 V620 M300 0 V620 M450 0 V620 M600 0 V620 M750 0 V620 M900 0 V620 M1050 0 V620 M1200 0 V620 M1350 0 V620 M1500 0 V620"/>
  </g>
  <!-- Lưới gạch men tường phải theo phối cảnh góc tụ -->
  <g stroke="#b5a794" stroke-width="2" opacity="0.75">
    <line x1="1620" y1="100" x2="1920" y2="115"/>
    <line x1="1620" y1="200" x2="1920" y2="235"/>
    <line x1="1620" y1="300" x2="1920" y2="355"/>
    <line x1="1620" y1="400" x2="1920" y2="475"/>
    <line x1="1620" y1="500" x2="1920" y2="595"/>
    <line x1="1620" y1="600" x2="1920" y2="715"/>
    <line x1="1740" y1="0" x2="1740" y2="660"/>
    <line x1="1840" y1="0" x2="1840" y2="695"/>
  </g>

  <!-- Vết ố vàng loang nhẹ quanh vòi nước và bồn rửa (Dầu mỡ & nước phèn sinh viên) -->
  <path d="M480 320 Q650 260 820 310 Q760 410 540 390 Z" fill="#d8c6a0" opacity="0.5" stroke="none" filter="url(#sink-ao)"/>
  <path d="M980 250 Q1120 220 1280 270 Q1220 360 1020 330 Z" fill="#d8c6a0" opacity="0.45" stroke="none" filter="url(#sink-ao)"/>
  <path d="M1400 340 Q1500 320 1590 360 Q1540 440 1420 410 Z" fill="#d8c6a0" opacity="0.4" stroke="none" filter="url(#sink-ao)"/>

  <!-- Sàn bếp gạch bông cùng tông phòng trọ -->
  <polygon points="0,620 1620,620 1920,720 1920,1080 0,1080" fill="#c8baa1"/>
  <!-- Nẹp chân tường gạch -->
  <polygon points="0,620 1620,620 1620,600 0,600" fill="#7a6850"/>
  <polygon points="1620,620 1920,720 1920,700 1620,600" fill="#5e4f3c"/>
  <line x1="0" y1="620" x2="1620" y2="620" stroke="#282b2b" stroke-width="4"/>
  <line x1="1620" y1="620" x2="1920" y2="720" stroke="#282b2b" stroke-width="4"/>

  <!-- Đường ron gạch sàn 3D -->
  <g stroke="#786955" stroke-width="2.5" opacity="0.55" stroke-dasharray="12 12">
    <line x1="250" y1="620" x2="0" y2="900"/>
    <line x1="600" y1="620" x2="280" y2="1080"/>
    <line x1="950" y1="620" x2="780" y2="1080"/>
    <line x1="1300" y1="620" x2="1280" y2="1080"/>
    <line x1="1620" y1="620" x2="1750" y2="1080"/>
    <line x1="0" y1="700" x2="1920" y2="780"/>
    <line x1="0" y1="810" x2="1920" y2="880"/>
    <line x1="0" y1="940" x2="1920" y2="1000"/>
  </g>

  <!-- CHI TIẾT KẾT NỐI KHÔNG GIAN: KHUÔN BAO CỬA CHÍNH MÀU XANH XÁM Ở MÉP TRÁI (TỪ BỐI CẢNH 1) -->
  <g transform="translate(-80 0)" stroke="#282b2b" stroke-width="4">
    <rect x="80" y="0" width="40" height="620" fill="#271f18"/>
    <rect x="120" y="20" width="30" height="600" fill="#526b73"/>
    <rect x="110" y="120" width="12" height="28" rx="2" fill="#cbd5e1" stroke="#282b2b" stroke-width="2"/>
    <rect x="110" y="460" width="12" height="28" rx="2" fill="#cbd5e1" stroke="#282b2b" stroke-width="2"/>
  </g>

  <!-- ======================================================================== -->
  <!-- 2. KỆ GIA VỊ 3D GẮN TƯỜNG (Dầu ăn Simply, Nước mắm Chin-su, Muối, Knorr) -->
  <!-- ======================================================================== -->
  <g transform="translate(540 140)" stroke="#282b2b" stroke-width="4" stroke-linejoin="round">
    <polygon points="0,40 500,40 480,75 -20,75" fill="#000" opacity="0.18" filter="url(#sink-ao)"/>
    <rect x="0" y="18" width="480" height="20" fill="#673917" stroke="#282b2b" stroke-width="3.5"/>
    <polygon points="0,18 480,18 510,0 30,0" fill="#9c5c2d" stroke="#282b2b" stroke-width="3.5"/>
    <polygon points="60,38 60,78 72,38" fill="#282b2b" stroke="none"/>
    <polygon points="420,38 420,78 432,38" fill="#282b2b" stroke="none"/>

    <!-- Chai dầu ăn Simply vàng óng -->
    <g transform="translate(60 -110)">
      <ellipse cx="25" cy="125" rx="22" ry="8" fill="#000" opacity="0.2" filter="url(#sink-ao)"/>
      <rect x="0" y="15" width="50" height="110" rx="10" fill="#f59e0b" stroke="#282b2b" stroke-width="3.5"/>
      <rect x="15" y="-10" width="20" height="25" rx="4" fill="#dc2626" stroke="#282b2b" stroke-width="2.5"/>
      <text x="25" y="75" font-family="Arial" font-size="10" font-weight="bold" fill="#78350f" text-anchor="middle">DẦU ĂN</text>
    </g>
    <!-- Chai nước mắm Chin-su đỏ sẫm -->
    <g transform="translate(140 -95)">
      <ellipse cx="22" cy="110" rx="20" ry="7" fill="#000" opacity="0.2" filter="url(#sink-ao)"/>
      <rect x="0" y="15" width="44" height="95" rx="8" fill="#991b1b" stroke="#282b2b" stroke-width="3.5"/>
      <rect x="13" y="-5" width="18" height="20" rx="3" fill="#f59e0b" stroke="#282b2b" stroke-width="2"/>
      <text x="22" y="65" font-family="Arial" font-size="9" font-weight="bold" fill="#fef08a" text-anchor="middle">NƯỚC MẮM</text>
    </g>
    <!-- Hũ muối & hạt nêm Knorr xanh -->
    <g transform="translate(215 -70)">
      <rect x="0" y="0" width="48" height="70" rx="8" fill="#f8fafc" stroke="#282b2b" stroke-width="3"/>
      <text x="24" y="42" font-family="Arial" font-size="10" font-weight="bold" fill="#334155" text-anchor="middle">MUỐI</text>
    </g>
    <g transform="translate(285 -80)">
      <rect x="0" y="0" width="55" height="80" rx="8" fill="#16a34a" stroke="#282b2b" stroke-width="3"/>
      <text x="27" y="45" font-family="Arial" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">KNORR</text>
    </g>
    <!-- Cuộn khăn giấy bếp tròn -->
    <g transform="translate(370 -75)">
      <ellipse cx="28" cy="0" rx="26" ry="11" fill="#f1f5f9" stroke="#282b2b" stroke-width="3"/>
      <rect x="2" y="0" width="52" height="75" fill="#e2e8f0" stroke="#282b2b" stroke-width="3"/>
      <ellipse cx="28" cy="75" rx="26" ry="11" fill="#f1f5f9" stroke="#282b2b" stroke-width="3"/>
    </g>
  </g>

  <!-- ======================================================================== -->
  <!-- 3. BÀN BẾP BỒN RỬA INOX KÊ SÁT KHÍT GÓC TƯỜNG PHẢI (ĂN NHẬP HOÀN TOÀN VỚI TƯỜNG) -->
  <!-- Phía sau áp sát tường y=480, bên phải chạm khít góc tường phải x=1620! -->
  <!-- ======================================================================== -->
  <g id="sink-counter-flush">
    <!-- Bóng đổ tiếp sàn của bệ tủ bếp -->
    <polygon points="260,845 1620,845 1650,910 210,910" fill="#000" opacity="0.28" filter="url(#sink-ao)"/>

    <!-- GỜ NẸP ĐÁ GRANIT CHẮN NƯỚC SÁT CHÂN TƯỜNG GẠCH (Sealant & Backsplash Lip) -->
    <!-- Chạy thẳng suốt từ mép trái bàn đến góc tường x=1620 và bẻ vào tường phải -->
    <polygon points="320,445 1620,445 1620,465 320,465" fill="#414d52" stroke="#282b2b" stroke-width="3.5"/>
    <line x1="320" y1="447" x2="1620" y2="447" stroke="#ffffff" stroke-width="3" opacity="0.85"/>
    

    <!-- THÂN TỦ BẾP 3D (Kê sát tường sau y=620, góc phải chạm khít tường x=1620) -->
    <!-- Mặt hông bên trái -->
    <polygon points="290,490 340,530 340,840 290,780" fill="#39454a" stroke="#282b2b" stroke-width="4.5"/>
    <!-- Mặt trước thân tủ bếp (Front Face) khít vào góc tường phải x=1620 -->
    <polygon points="340,530 1620,530 1620,840 340,840" fill="#546369" stroke="#282b2b" stroke-width="5" stroke-linejoin="round"/>

    <!-- Gờ chân thụt lùi (Toe Kick) -->
    <polygon points="360,840 1600,840 1590,865 370,865" fill="#242b2e" stroke="#282b2b" stroke-width="3"/>
    <!-- 3 cánh cửa tủ lớn có tay nắm tròn -->
    <g stroke="#282b2b" stroke-width="3.5">
      <rect x="365" y="555" width="380" height="265" fill="#435056"/>
      <rect x="775" y="555" width="380" height="265" fill="#435056"/>
      <rect x="1185" y="555" width="400" height="265" fill="#435056"/>
      <circle cx="715" cy="680" r="8" fill="#cbd5e1" stroke-width="2.5"/>
      <circle cx="805" cy="680" r="8" fill="#cbd5e1" stroke-width="2.5"/>
      <circle cx="1545" cy="680" r="8" fill="#cbd5e1" stroke-width="2.5"/>
    </g>

    <!-- MẶT BÀN ĐÁ GRANIT DÀY 3D TRÊN CÙNG (Khít vào gờ tường sau và góc tường phải x=1620) -->
    <polygon points="320,465 1620,465 1620,530 310,530" fill="#7a8d94" stroke="#282b2b" stroke-width="5" stroke-linejoin="round"/>
    <polygon points="310,530 1620,530 1620,548 310,548" fill="#414d52" stroke="#282b2b" stroke-width="3"/>

    <!-- LÒNG CHẬU RỬA ĐÔI INOX CHÌM SÂU 3D -->
    <polygon points="360,475 1060,475 1090,522 380,522" fill="#242b2e" stroke="#282b2b" stroke-width="4.5"/>
    <polygon points="375,480 690,480 705,518 390,518" fill="url(#inox-top)" stroke="#282b2b" stroke-width="3"/>
    <polygon points="730,480 1045,480 1075,518 750,518" fill="url(#inox-top)" stroke="#282b2b" stroke-width="3"/>
    <!-- Lỗ thoát nước & lọc rác -->
    <ellipse cx="545" cy="500" rx="25" ry="9" fill="#1e2426" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="905" cy="500" rx="25" ry="9" fill="#1e2426" stroke="#64748b" stroke-width="2"/>

    <!-- VÒI NƯỚC INOX CỔ NGỖNG CAO CẤP 3D VỚI CẦN GẠT GẮN TRÊN MẶT ĐÁ -->
    <g transform="translate(720 472)">
      <ellipse cx="0" cy="0" rx="22" ry="8" fill="#64748b" stroke="#282b2b" stroke-width="3"/>
      <path d="M0 0 V-170 Q0 -230 -60 -230 Q-120 -230 -120 -160 V-138" fill="none" stroke="#cbd5e1" stroke-width="15" stroke-linecap="round"/>
      <path d="M0 0 V-170 Q0 -230 -60 -230 Q-120 -230 -120 -160 V-138" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>
      <rect x="-130" y="-138" width="20" height="14" rx="3" fill="#475569" stroke="#282b2b" stroke-width="2.5"/>
      <ellipse cx="-120" cy="-105" rx="5" ry="8" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5"/>
      <line x1="10" y1="-8" x2="48" y2="-30" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
      <circle cx="48" cy="-30" r="8" fill="#e2e8f0" stroke="#282b2b" stroke-width="2"/>
    </g>

    <!-- KHAY ÚP CHÉN ĐĨA BẰNG NHỰA XANH BẠC HÀ 3D (ĐÃ RỬA SẠCH GỌN GÀNG) -->
    <g transform="translate(1120 405)">
      <polygon points="0,65 340,65 375,115 35,115" fill="#a7f3d0" stroke="#282b2b" stroke-width="4" opacity="0.95"/>
      <polygon points="35,115 375,115 375,135 35,135" fill="#34d399" stroke="#282b2b" stroke-width="3.5"/>
      <ellipse cx="70" cy="80" rx="16" ry="52" fill="#f8fafc" stroke="#282b2b" stroke-width="3"/>
      <ellipse cx="110" cy="80" rx="16" ry="52" fill="#f8fafc" stroke="#282b2b" stroke-width="3"/>
      <ellipse cx="150" cy="80" rx="16" ry="52" fill="#f8fafc" stroke="#282b2b" stroke-width="3"/>
      <ellipse cx="190" cy="80" rx="16" ry="52" fill="#f8fafc" stroke="#282b2b" stroke-width="3"/>
      <path d="M235 102 Q280 55 325 102 Z" fill="#f1f5f9" stroke="#282b2b" stroke-width="3.5"/>
      <path d="M250 72 Q295 25 340 72 Z" fill="#f1f5f9" stroke="#282b2b" stroke-width="3.5"/>
      <!-- Ống cắm đũa -->
      <rect x="320" y="60" width="35" height="60" rx="6" fill="#38bdf8" stroke="#282b2b" stroke-width="3"/>
      <line x1="330" y1="60" x2="315" y2="-30" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
      <line x1="340" y1="60" x2="335" y2="-35" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
      <line x1="350" y1="60" x2="355" y2="-28" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- CHAI RỬA CHÉN SUNLIGHT & MIẾNG MÚT VÀNG XANH 3D -->
    <g transform="translate(400 460)">
      <rect x="0" y="-65" width="38" height="75" rx="10" fill="#facc15" stroke="#282b2b" stroke-width="3.5"/>
      <rect x="11" y="-80" width="16" height="16" rx="4" fill="#dc2626" stroke="#282b2b" stroke-width="2.5"/>
      <polygon points="55,-15 105,-15 115,10 65,10" fill="#eab308" stroke="#282b2b" stroke-width="2.5"/>
      <polygon points="55,-25 105,-25 105,-15 55,-15" fill="#15803d" stroke="#282b2b" stroke-width="2.5"/>
    </g>

    <!-- BÌNH NƯỚC LỌC 20L XANH DƯƠNG KÊ GÓC BẾP (GẦN GÓC TƯỜNG PHẢI) -->
    <g transform="translate(1500 375)" stroke="#282b2b" stroke-width="3.5">
      <rect x="0" y="0" width="85" height="115" rx="18" fill="#0284c7" opacity="0.9"/>
      <line x1="6" y1="30" x2="79" y2="30" stroke="#38bdf8" stroke-width="3"/>
      <line x1="6" y1="65" x2="79" y2="65" stroke="#38bdf8" stroke-width="3"/>
      <line x1="6" y1="95" x2="79" y2="95" stroke="#38bdf8" stroke-width="3"/>
      <rect x="-14" y="80" width="16" height="14" rx="3" fill="#ffffff" stroke="#282b2b" stroke-width="2.5"/>
      <rect x="-18" y="87" width="9" height="7" fill="#ef4444" stroke="none"/>
    </g>

    <!-- THÙNG MÌ TÔM HẢO HẢO CHUA CAY ĐẶT GẦM TỦ BẾP -->
    <g transform="translate(440 850)" stroke="#282b2b" stroke-width="3">
      <polygon points="0,0 140,0 155,45 15,45" fill="#ea580c" stroke="#282b2b" stroke-width="3"/>
      <polygon points="15,45 155,45 155,75 15,75" fill="#c2410c" stroke="#282b2b" stroke-width="3"/>
      <text x="78" y="28" font-family="Arial" font-size="13" font-weight="900" fill="#fef08a" text-anchor="middle">HẢO HẢO</text>
      <text x="85" y="62" font-family="Arial" font-size="8.5" font-weight="bold" fill="#ffffff" text-anchor="middle">MÌ TÔM CHUA CAY</text>
    </g>
  </g>

  <!-- ======================================================================== -->
  <!-- 4. CÂY CHỔI RƠM 3D DỰNG GÓC TƯỜNG (TIẾP GIÁP KHUÔN CỬA BÊN TRÁI) -->
  <!-- ======================================================================== -->
  <g transform="translate(210 520)" stroke="#282b2b" stroke-width="4" stroke-linejoin="round">
    <line x1="-30" y1="440" x2="-140" y2="-40" stroke="#000" stroke-width="16" opacity="0.2" stroke-linecap="round" filter="url(#sink-ao)"/>
    <line x1="-15" y1="430" x2="-110" y2="-30" stroke="#a16207" stroke-width="10" stroke-linecap="round"/>
    <polygon points="-45,410 35,475 -20,510 -85,450" fill="#d97706" stroke="#282b2b" stroke-width="4"/>
    <line x1="-55" y1="425" x2="5" y2="465" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
    <path d="M50 470 L140 470 L160 505 L30 505 Z" fill="#0284c7" stroke="#282b2b" stroke-width="3.5"/>
    <line x1="95" y1="470" x2="95" y2="380" stroke="#0284c7" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- TIÊU ĐỀ BỐI CẢNH 2 -->
  <rect x="30" y="30" width="550" height="55" rx="12" fill="#181a1d" opacity="0.9" stroke="#334155" stroke-width="2"/>
  <text x="50" y="66" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#f8f3e7">BỐI CẢNH 2: GÓC BẾP &amp; BỒN RỬA CHÉN (3D VIEW · 50MM)</text>
</svg>