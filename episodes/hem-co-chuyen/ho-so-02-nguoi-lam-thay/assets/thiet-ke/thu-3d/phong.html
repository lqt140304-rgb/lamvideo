<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script></head>
<body><script type="module">
// Nam 3D đặt vào phòng Hồ sơ 02: camera dựng lại đúng phép chiếu của `boi-canh.tsx` (nhìn ngang, tâm ảnh dịch theo horizon,
// tiêu cự F = mm/36·1920 px), toạ độ phòng tính bằng cm. Nền trong suốt để ghép đè lên video phòng.
import * as THREE from 'three';
import { buildNam } from './nam-3d.js';
import { motionAt } from './dong-tac.js';
const VIEWS = { wide: { pos: [228, 152, 800], target: [228, 0], mm: 34, horizon: 395 } }; // chép từ boi-canh.tsx VIEWS
const W = 1920, H = 1080, q = new URLSearchParams(location.search), V = VIEWS[q.get('view') || 'wide'];
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true, premultipliedAlpha: false });
renderer.setPixelRatio(1); renderer.setSize(W, H); renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap; renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
// camera khớp phòng
// Camera: mặc định lấy VIEWS (khớp boi-canh.tsx). `?cam=<url json>` đọc camera từ file thông số xuất từ Blender/.blend:
// { "pos":[x,y,z] (cm, y lên), "target":[x,y,z] hoặc "euler":[rx,ry,rz] (độ), "lens_mm":34, "sensor_width":36, "width":1920, "height":1080, "horizon_px":395 (tuỳ chọn, bỏ = tâm ảnh) }
const near = 10, far = 4000, cam = new THREE.PerspectiveCamera();
let camSpec = { pos: V.pos, target: [V.target[0], V.pos[1], V.target[1]], lens_mm: V.mm, sensor_width: 36, width: W, height: H, horizon_px: V.horizon };
if (q.get('cam')) { const j = await (await fetch(q.get('cam'))).json(); camSpec = { ...camSpec, ...j, target: j.target || null }; }
const Fpx = (camSpec.lens_mm / camSpec.sensor_width) * camSpec.width, hz = camSpec.horizon_px ?? camSpec.height / 2;
cam.position.set(...camSpec.pos);
if (camSpec.target) cam.lookAt(...camSpec.target); else cam.rotation.set(...camSpec.euler.map((d) => d * Math.PI / 180), 'XYZ');
cam.updateMatrixWorld();
cam.projectionMatrix.makePerspective(-(camSpec.width / 2) / Fpx * near, (camSpec.width / 2) / Fpx * near, hz / Fpx * near, -(camSpec.height - hz) / Fpx * near, near, far);
cam.projectionMatrixInverse.copy(cam.projectionMatrix).invert();
// ánh sáng ban ngày: nắng từ cửa sổ tường phải (LIGHT_SOURCES.window = [460,150,155]), trời ấm dịu, hắt sàn
scene.add(new THREE.HemisphereLight('#fff6ea', '#d8c6aa', 1.6));
const sun = new THREE.DirectionalLight('#ffe7c4', 2.4); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 9; sun.shadow.blurSamples = 20; sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.6;
Object.assign(sun.shadow.camera, { left: -260, right: 260, top: 300, bottom: -200, near: 10, far: 1400 });
scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight('#e8eeff', 0.7); fill.position.set(-300, 200, 600); scene.add(fill);
// rim nhẹ từ sau lưng–trên đầu, tông ấm như đèn/cửa sổ phòng: tách vai và tóc khỏi nền, không viền đen
const rim = new THREE.DirectionalLight('#ffe2b8', 0.45); rim.position.set(200, 300, -250); scene.add(rim, rim.target);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(460, 780), new THREE.ShadowMaterial({ opacity: 0.11 }));
floor.rotation.x = -Math.PI / 2; floor.position.set(230, 0.2, 390); floor.receiveShadow = true; scene.add(floor);
// bóng tiếp xúc mềm
const cv = document.createElement('canvas'); cv.width = cv.height = 128; const g = cv.getContext('2d');
const rg = g.createRadialGradient(64, 64, 0, 64, 64, 64); rg.addColorStop(0, 'rgba(70,52,36,0.30)'); rg.addColorStop(1, 'rgba(70,52,36,0)'); g.fillStyle = rg; g.fillRect(0, 0, 128, 128);
const blob = new THREE.Mesh(new THREE.PlaneGeometry(60, 34), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cv), transparent: true, depthWrite: false }));
blob.rotation.x = -Math.PI / 2; scene.add(blob);
const nam = buildNam(THREE, {}); scene.add(nam.root);

window.show = (t) => {
  const m = motionAt(t);
  nam.pose(m.pose);
  nam.root.position.set(m.x, m.dy, m.z); nam.root.rotation.y = m.yaw;
  nam.joints.chest.scale.set(1 + 0.008 * m.breath, 1 + 0.006 * m.breath, 1 + 0.012 * m.breath);
  blob.position.set(m.x, 0.3, m.z); blob.scale.setScalar(1 / (1 + Math.max(0, m.dy) / 25)); blob.material.opacity = 0.25 / (1 + Math.max(0, m.dy) / 12);
  // hướng nắng cố định theo cửa sổ phòng (không trượt theo nhân vật)
  sun.position.set(560, 260, 240); sun.target.position.set(230, 60, 390);
  rim.target.position.set(m.x, 90, m.z);
  renderer.render(scene, cam);
  return renderer.domElement.toDataURL('image/png');
};
window.ready = true;
</script></body></html>
