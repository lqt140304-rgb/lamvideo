<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hồ sơ 02: Người làm thay — Trình xem nhân vật Style B</title>
  <style>
    :root {
      --bg: #121517;
      --card-bg: #1c2126;
      --text: #e8ecf0;
      --text-muted: #9aa5b0;
      --accent: #5c7a70;
      --accent-hover: #72968b;
      --border: #2e3640;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 1400px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      text-transform: uppercase;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      background: var(--card-bg);
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
    }
    button {
      background: #252c34;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    button:hover {
      background: #313a44;
      border-color: #445160;
    }
    button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      font-weight: 600;
    }
    .zoom-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .svg-wrapper {
      width: 100%;
      height: 70vh;
      min-height: 480px;
      background: #f6f1e8;
      border-radius: 14px;
      border: 1px solid #ded5c6;
      overflow: hidden;
      cursor: grab;
      position: relative;
    }
    .svg-wrapper:active {
      cursor: grabbing;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
      transition: viewBox 0.35s ease;
    }
    .info-bar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .info-bar b {
      color: #fff;
    }
    .hint {
      font-size: 12px;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>
        Hồ sơ 02: Người làm thay
        <span class="badge">Mẫu B Approved</span>
      </h1>
      <span class="hint">Kéo chuột để di chuyển (Pan) · Lăn chuột hoặc nút +/− để Phóng to (Zoom)</span>
    </header>

    <div class="controls">
      <div class="tabs">
        <button id="tab-all" class="active" onclick="setFocus('all')">Toàn cảnh (3 nhân vật)</button>
        <button id="tab-nam" onclick="setFocus('nam')">1. Nam (Sinh viên chính)</button>
        <button id="tab-twin" onclick="setFocus('twin')">2. Người Kia (Bản sao)</button>
        <button id="tab-tung" onclick="setFocus('tung')">3. Tùng (Đá bóng số 7)</button>
        <button id="tab-compare" onclick="setFocus('compare')">So sánh Nam & Người Kia</button>
      </div>

      <div class="zoom-group">
        <button onclick="zoomIn()" title="Phóng to"><b>+</b></button>
        <button onclick="zoomOut()" title="Thu nhỏ"><b>−</b></button>
        <button onclick="resetView()" title="Đặt lại khung hình">Reset</button>
      </div>
    </div>

-lw, 1))"></path><g><defs><clipPath id="b-tung-normal-R3m-eyes"><ellipse cx="-11" cy="99" rx="16" ry="14"></ellipse><ellipse cx="29" cy="96" rx="14.5" ry="13"></ellipse></clipPath></defs><ellipse cx="-11" cy="99" rx="16" ry="14" fill="#f8f3e7" style="stroke-width:calc(2.5px * var(--lw, 1))"></ellipse><ellipse cx="29" cy="96" rx="14.5" ry="13" fill="#f8f3e7" style="stroke-width:calc(2.5px * var(--lw, 1))"></ellipse><g clip-path="url(#b-tung-normal-R3m-eyes)"><ellipse cx="-8" cy="99" rx="4.5" ry="5.5" fill="#282b2b" stroke="none"></ellipse><ellipse cx="31" cy="96" rx="4.5" ry="5.5" fill="#282b2b" stroke="none"></ellipse><circle cx="-6.5" cy="97" r="1.4" fill="#ffffff" stroke="none"></circle><circle cx="32.5" cy="94" r="1.4" fill="#ffffff" stroke="none"></circle><path d="M -32 76 L 48 74 L 48 86 L -32 87 Z" fill="#dbad82" style="stroke-width:calc(2.4px * var(--lw, 1))"></path></g><path d="M -26 80 Q -10 74 3 77 M 17 76 Q 30 72 42 75" fill="none" style="stroke-width:calc(5.5px * var(--lw, 1))"></path><path d="M 12 113 Q 23 115 20 123 L 12 125" fill="none" style="stroke-width:calc(2.5px * var(--lw, 1))"></path><g><path d="M 0 141 Q 12 146 25 141" fill="none" style="stroke-width:calc(2.6px * var(--lw, 1))"></path></g></g></g><text x="0" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#515956" stroke="none">BÌNH THƯỜNG</text></g></g><text x="960" y="1055" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#828a86">Đường nét hữu cơ đồng bộ mẫu B · Không có nét thừa hay hở viền · Nam &amp; Người Kia: cùng gương mặt, khác bên nốt ruồi; r = 2.2 theo mẫu.</text></svg>
    </div>

    <div class="info-bar">
      <span id="info-text">🌟 <b>Toàn cảnh 3 nhân vật:</b> Nam, Người Kia (bản sao 100%), Tùng (đồ thể thao đá bóng #7). Chuẩn Style B hữu cơ.</span>
      <span class="hint">Vector SVG 1920×1080 gốc · Đã tối ưu hóa đường viền & bàn tay</span>
    </div>
  </div>

  <script>
    const svg = document.getElementById('master-svg');
    const infoText = document.getElementById('info-text');

    const views = {
      'all': {
        box: [0, 0, 1920, 1080],
        desc: '🌟 <b>Toàn cảnh 3 nhân vật:</b> Nam, Người Kia (bản sao 100%), Tùng (đồ thể thao đá bóng #7).'
      },
      'nam': {
        box: [40, 110, 560, 950],
        desc: '🟢 <b>Nam:</b> Áo thun rêu, quần xám, nốt ruồi đuôi mày trái. Tóc tròn không nét thừa, hai tay buông lơi tự nhiên ngoài thân áo.'
      },
      'twin': {
        box: [680, 110, 560, 950],
        desc: '👥 <b>Người Kia:</b> Bản sao sinh học 100% của Nam (cùng mặt, tóc, nốt ruồi, áo xanh, dáng tay đầy đặn). Biểu cảm: Điềm tĩnh, Thân thiện, Bí hiểm.'
      },
      'tung': {
        box: [1320, 110, 560, 950],
        desc: '⚽ <b>Tùng:</b> Tóc ngắn tỉa mảng khối layer Mẫu B, áo bóng đá navy #7, quần đùi, giày turf ôm chân, không đeo kính.'
      },
      'compare': {
        box: [40, 110, 1200, 950],
        desc: '🔍 <b>Đối chiếu Nam vs Bản Sao:</b> 100% đồng nhất từ nốt ruồi, chân tóc đến nếp áo và vị trí 2 cánh tay.'
      }
    };

    let currentViewKey = 'all';
    let currentBox = [...views['all'].box];

    function setFocus(key) {
      currentViewKey = key;
      document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById('tab-' + key);
      if (activeBtn) activeBtn.classList.add('active');

      currentBox = [...views[key].box];
      applyViewBox();
      infoText.innerHTML = views[key].desc;
    }

    function applyViewBox() {
      svg.setAttribute('viewBox', currentBox.join(' '));
    }

    function zoomIn() {
      const dw = currentBox[2] * 0.15;
      const dh = currentBox[3] * 0.15;
      currentBox[0] += dw / 2;
      currentBox[1] += dh / 2;
      currentBox[2] -= dw;
      currentBox[3] -= dh;
      applyViewBox();
    }

    function zoomOut() {
      const dw = currentBox[2] * 0.15;
      const dh = currentBox[3] * 0.15;
      currentBox[0] += dw / 2;
      currentBox[1] += dh / 2;
      currentBox[2] -= dw;
      currentBox[3] -= dh;
      applyViewBox();
    }

    function resetView() {
      setFocus(currentViewKey);
    }

    // Pan & Drag
    let isPanning = false;
    let startX = 0, startY = 0;
    let initialBox = [];
    const container = document.querySelector('.svg-wrapper');

    container.addEventListener('mousedown', (e) => {
      isPanning = true;
      startX = e.clientX;
      startY = e.clientY;
      initialBox = [...currentBox];
    });

    window.addEventListener('mousemove', (e) => {
      if (!isPanning) return;
      const rect = svg.getBoundingClientRect();
      const scaleX = currentBox[2] / rect.width;
      const scaleY = currentBox[3] / rect.height;
      const dx = (e.clientX - startX) * scaleX;
      const dy = (e.clientY - startY) * scaleY;
      currentBox[0] = initialBox[0] - dx;
      currentBox[1] = initialBox[1] - dy;
      applyViewBox();
    });

    window.addEventListener('mouseup', () => { isPanning = false; });

    // Touch
    container.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        isPanning = true;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        initialBox = [...currentBox];
      }
    });
    window.addEventListener('touchmove', (e) => {
      if (!isPanning || e.touches.length !== 1) return;
      const rect = svg.getBoundingClientRect();
      const scaleX = currentBox[2] / rect.width;
      const scaleY = currentBox[3] / rect.height;
      const dx = (e.touches[0].clientX - startX) * scaleX;
      const dy = (e.touches[0].clientY - startY) * scaleY;
      currentBox[0] = initialBox[0] - dx;
      currentBox[1] = initialBox[1] - dy;
      applyViewBox();
    });
    window.addEventListener('touchend', () => { isPanning = false; });

    // Wheel zoom
    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.deltaY < 0) zoomIn();
      else zoomOut();
    }, { passive: false });
  </script>
